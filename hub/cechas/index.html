<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Cecho planas</title>
<script src="/hub/shared/gate.js"></script>
<link rel="icon" type="image/png" href="https://app.dedesbaldai.lt/hub/shared/favicon-64.png">
<link rel="apple-touch-icon" href="https://app.dedesbaldai.lt/hub/shared/touch-180.png">
<script>try{var t=localStorage.getItem('hub-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
html{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}

/* Layout: one screen. Slim header strip, floor plan drawn to scale (1 unit = 1 cm) filling the left, roster/inspector rail on the right. */
:root{
  --bg:#EEF0EE; --floor:#E1E4E1; --grid:#D0D5D1; --wall:#22292C; --panel:#FFFFFF; --line:#D7DBD8; --well:#E3E6E3;
  --ink:#15191B; --muted:#5B6468; --mline:#22292C; --booth:#E6E9E6;
  --mark:#f0b400; --mark-ink:#231a00;
  --accent:#0D6C66; --accent-ink:#FFFFFF; --accent-soft:#D7ECE9;
  --run:#17924b; --idle:#6f7b86; --down:#d23f2c; --busy:#2267c9; --warn:#b97800;
  --person:#15191B; --person-ink:#FFFFFF;
  --plan:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101315; --floor:#1B2023; --grid:#283035; --wall:#cdd5d0; --panel:#181C1F; --line:#2A3135; --well:#0B0E10;
  --ink:#E7EBE9; --muted:#97A1A4; --mline:#0b0e0f; --booth:#252C30;
  --mark:#f5bd1f; --mark-ink:#231a00;
  --accent:#4CC4B9; --accent-ink:#04211E; --accent-soft:#15302D;
  --run:#35c274; --idle:#8d99a4; --down:#f0624f; --busy:#5d9bf0; --warn:#f0b23a;
  --person:#E7EBE9; --person-ink:#101315; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#101315; --floor:#1B2023; --grid:#283035; --wall:#cdd5d0; --panel:#181C1F; --line:#2A3135; --well:#0B0E10;
  --ink:#E7EBE9; --muted:#97A1A4; --mline:#0b0e0f; --booth:#252C30;
  --mark:#f5bd1f; --mark-ink:#231a00;
  --accent:#4CC4B9; --accent-ink:#04211E; --accent-soft:#15302D;
  --run:#35c274; --idle:#8d99a4; --down:#f0624f; --busy:#5d9bf0; --warn:#f0b23a;
  --person:#E7EBE9; --person-ink:#101315; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.35;
  display:flex;flex-direction:column;gap:10px;padding-block:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));box-sizing:border-box}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.counts{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--display);font-size:19px;font-weight:600}
.counts span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.d-run{background:var(--run)}.d-idle{background:var(--idle)}.d-down{background:var(--down)}.d-ppl{background:var(--person)}.d-pause{background:var(--warn)}.d-inst{background:var(--mark)}
.sp{flex:1}
.clock{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.sync{font-size:13px;color:var(--muted);max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1500px){h1{font-size:21px}.counts{font-size:17px;gap:4px 11px}.btn{padding:5px 9px}.clock{font-size:22px}header{gap:6px 12px}}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px}
.mapwrap{min-width:0;min-height:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative}
#map{display:block;width:100%;height:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#brk{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:2;background:var(--mark);color:var(--mark-ink);font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.04em;text-transform:uppercase;padding:6px 20px;border-radius:6px;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
body.tv #brk{font-size:38px;padding:10px 28px}
#ctl3{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:70%}
#ctl3 button{min-width:42px;height:42px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-family:var(--display);font-weight:700;font-size:20px;line-height:1}
#ctl3 button:hover{border-color:var(--ink)}
#ctl3 button[aria-pressed="true"]{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
body:not(.tv) .tv-only{display:none}
body.tv #ctl3 button{min-width:56px;height:56px;font-size:26px}
#btnRadio.on{background:var(--mark);color:var(--mark-ink);border-color:var(--mark);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#radio{position:fixed;top:calc(64px + env(safe-area-inset-top, 0px));right:max(16px, env(safe-area-inset-right, 0px));z-index:25;width:min(380px,calc(100vw - 32px));max-height:calc(100vh - 90px);display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 16px 40px rgba(0,0,0,.22)}
#radio .rh{display:flex;align-items:center;justify-content:space-between;gap:8px}
#radio .rh h2{font-family:var(--display);font-size:22px;margin:0;text-transform:uppercase;letter-spacing:.03em}
#radio .rnow{display:flex;align-items:center;gap:10px}
#radio .rplay{width:52px;height:52px;flex:none;border-radius:50%;border:0;background:var(--mark);color:var(--mark-ink);font-size:22px;cursor:pointer}
#radio .rplay:disabled{opacity:.4;cursor:default}
#radio .rname{flex:1;min-width:0;font-family:var(--display);font-weight:700;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#radio .rname small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}
#radio input[type=range]{width:100%;accent-color:var(--mark)}
#radio input[type=search]{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:inherit}
#radio .rlist{overflow:auto;min-height:0;display:flex;flex-direction:column}
#radio .rsec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 0 2px}
#radio .rrow{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line)}
#radio .rrow:first-of-type{border-top:0}
#radio .rgo{flex:1;min-width:0;text-align:left;background:none;border:0;padding:8px 2px;font:inherit;font-weight:600;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#radio .rgo.on{color:var(--run)}
#radio .rgo small{font-weight:400;color:var(--muted);margin-left:6px}
#radio .rstar{background:none;border:0;font-size:20px;line-height:1;color:var(--muted);cursor:pointer;padding:4px 6px}
#radio .rstar.on{color:var(--mark)}
body.tv #radio{font-size:18px;width:min(460px,calc(100vw - 32px))}
body.tv #radio .rgo{padding:12px 2px}
#three{position:absolute;inset:0;touch-action:none}
#three canvas{display:block;width:100%;height:100%}
.hint3{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:3px 8px;pointer-events:none}
body.tv .hint3{display:none}
.rail{min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.card h2{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.pickbar{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.pickbar .btn{background:transparent;border-color:var(--mark-ink);color:var(--mark-ink)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.stbtn{flex:1;min-width:84px;border:2px solid var(--line);background:transparent;border-radius:6px;padding:9px 6px;font-family:var(--display);font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
.stbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--bg)}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.list li{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
ul.list li:first-child{border-top:0}
.pbtn{background:none;border:0;padding:2px 0;text-align:left;font-weight:600;font-size:16px;flex:1;min-width:0;overflow-wrap:anywhere}
.pbtn:hover{text-decoration:underline}
.where{color:var(--muted);font-size:14px;text-align:right;overflow-wrap:anywhere}
.where.on{color:var(--ink)}
.x{background:none;border:1px solid var(--line);border-radius:5px;padding:2px 8px;color:var(--muted)}
.x:hover{border-color:var(--down);color:var(--down)}
input[type=text],input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:0}
input.grow{flex:1}
input.q{width:70px;text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted)}
textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:6px 8px;width:100%;min-height:110px;resize:vertical}
.card summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card summary::-webkit-details-marker{display:none}
.card summary::after{content:'+';font-family:var(--display);font-weight:700;font-size:24px;line-height:1;color:var(--muted)}
.card[open]>summary::after{content:'–'}
details.card:not([open]){gap:0}
.stsel{max-width:58%;min-width:0;flex:0 1 auto;font-size:14px;padding:5px 6px;border-radius:6px;cursor:pointer}
.stsel.on{border-color:var(--ink);font-weight:600}
.pbtn[data-pid]{cursor:grab;user-select:none;-webkit-user-select:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-weight:600;font-size:15px}
.chip:hover{border-color:var(--ink)}.chip .sub{font-weight:400}
.dragchip{position:fixed;left:0;top:0;z-index:20;pointer-events:none;background:var(--person);color:var(--person-ink);font-family:var(--display);font-weight:600;font-size:18px;padding:6px 14px;border-radius:999px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.dragchip.ok{background:var(--mark);color:var(--mark-ink)}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
.pcol{flex:1 1 auto;min-width:6em;display:flex;flex-direction:column}
.where.inst{flex:0 1 auto;max-width:62%;display:flex;flex-direction:column;align-items:flex-end;gap:2px;line-height:1.25}
.where.inst .pj{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.badge{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 6px;font-size:12px;font-weight:600;white-space:nowrap}
.chk{display:flex;flex-wrap:wrap;gap:4px 14px}
.chk label{display:inline-flex;gap:5px;align-items:center}
.wl{display:grid;grid-template-columns:1fr 80px auto;gap:6px;align-items:center}
.pickbar input{background:var(--panel);border-color:var(--mark-ink);color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-weight:500;z-index:5;max-width:90%}

/* map drawing */
.it{cursor:pointer}
.it .hit{fill:transparent;stroke:transparent;stroke-width:5}
.it:hover .hit{stroke:var(--muted);stroke-dasharray:14 10}
.it.sel .hit{stroke:var(--mark);stroke-dasharray:none;stroke-width:8}
.editing .it{cursor:grab}
.picking .it .hit{stroke:var(--mark);stroke-dasharray:14 10}
.lbl{font-family:var(--plan);font-weight:700;font-size:34px;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--floor);stroke-width:9px;stroke-linejoin:round}
.lbl.mproj{font-size:24px;font-weight:600;fill:var(--muted)}
.stt{font-family:var(--plan);font-weight:600;font-size:27px;text-anchor:middle;letter-spacing:.04em;paint-order:stroke;stroke:var(--floor);stroke-width:8px;stroke-linejoin:round}
.s-pause{fill:var(--warn)}.s-run{fill:var(--run)}.s-idle{fill:var(--idle)}.s-down{fill:var(--down)}.s-busy{fill:var(--busy)}
.pill rect{fill:var(--person)}
.pill text{fill:var(--person-ink);font-family:var(--plan);font-weight:600;font-size:29px;text-anchor:middle}
.pill,.fig{cursor:pointer}
.fig .bd{fill:#2f67b3;stroke:var(--mline);stroke-width:2.5}.fig.sel .bd{fill:var(--mark)}
.fig .hd{fill:#d9a97e;stroke:var(--mline);stroke-width:2.5}.fig .hr{fill:#5b4636}
.pill.sel rect{fill:var(--mark)}.pill.sel text{fill:var(--mark-ink)}
.dim{font-family:var(--plan);font-size:24px;fill:var(--muted)}
.elbl{font-family:var(--plan);font-weight:700;font-size:28px;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:9px;stroke-linejoin:round;pointer-events:none}
.rh{fill:var(--panel);stroke:var(--mark);stroke-width:6;cursor:nwse-resize}
.rdim{font-family:var(--plan);font-weight:700;font-size:28px;fill:var(--mark-ink);text-anchor:middle;paint-order:stroke;stroke:var(--mark);stroke-width:12px;stroke-linejoin:round;pointer-events:none}
.wprev{stroke:var(--mark);stroke-width:16;stroke-linecap:butt;opacity:.85;pointer-events:none}
.drawing #map,.drawing .it{cursor:crosshair}
.dh{fill:var(--mark);stroke:var(--mark-ink);stroke-width:4;cursor:move}
.vh{fill:var(--mark);stroke:var(--mark-ink);stroke-width:4;cursor:move}
.vadd{cursor:pointer}.vadd circle{fill:var(--panel);stroke:var(--ink);stroke-width:3}.vadd text{font-family:var(--body);font-weight:600;font-size:26px;text-anchor:middle;fill:var(--ink);pointer-events:none}
.pill text.pp{font-size:22px;font-weight:500}
.down .draw{opacity:.55}
.run .beacon{animation:pulse 1.4s ease-in-out infinite}
.run .mv-slide{animation:slide 4s ease-in-out infinite alternate}
.run .mv-feed{animation:feed 6s linear infinite}
.run .mv-feedy{animation:feedy 5s linear infinite}
@keyframes feedy{from{transform:translateY(-92px)}to{transform:translateY(92px)}}
.run .mv-gantry{animation:gantry 6s ease-in-out infinite alternate}
.run .mv-laser{animation:laser 2.2s ease-in-out infinite alternate}
.run .mv-spin{animation:spin 1.3s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.25}}
@keyframes slide{from{transform:translateX(-45px)}to{transform:translateX(45px)}}
@keyframes feed{from{transform:translateX(-170px)}to{transform:translateX(160px)}}
@keyframes gantry{from{transform:translateX(-135px)}to{transform:translateX(105px)}}
@keyframes laser{from{transform:translateY(-32px)}to{transform:translateY(32px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.wk{animation:wk 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.wk .ar{animation:ar 1.3s ease-in-out infinite alternate}.wk .ar2{animation-delay:-.65s}
@keyframes wk{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(2.5px,-2px) rotate(-7deg)}50%{transform:translate(-1.5px,1px) rotate(3deg)}75%{transform:translate(2px,1.5px) rotate(8deg)}}
@keyframes ar{from{transform:translateY(1px)}to{transform:translateY(-6px)}}
@media (prefers-reduced-motion: reduce){.run .mv,.run .beacon,.wk,.wk .ar{animation:none}}

/* TV mode: nothing to operate, just read */
body.tv .edit-only,body.tv #btnEdit,body.tv .sync{display:none}
body.tv main{grid-template-columns:minmax(0,1fr) 360px}
body.tv .rail{font-size:19px}
body.tv .pbtn{font-size:22px}
body.tv .where{font-size:18px}
body.tv h1{font-size:32px}.tv .counts{font-size:24px}.tv .clock{font-size:34px}

@media (max-width:820px){
  html,body{height:auto}
  main{display:flex;flex-direction:column}
  .mapwrap{overflow-x:auto}
  .mapwrap.v3{height:460px;overflow:hidden}
  #map{min-width:860px;height:auto}
  body.tv main{display:flex}
}

/* TV display: everything sized from the screen height, so a 960×540 TV box and a 1920×1080 PC look the same */
body.tv{height:100vh;overflow:hidden;gap:1vh;padding-block:1.2vh;padding-left:max(1.6vh, env(safe-area-inset-left, 0px));padding-right:max(1.6vh, env(safe-area-inset-right, 0px))}
body.tv header{flex-wrap:nowrap;gap:2vh;min-width:0}
body.tv h1{font-size:3.6vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
body.tv .counts{font-size:3.4vh;flex-wrap:nowrap;white-space:nowrap;gap:2vh}
body.tv .dot{width:1.8vh;height:1.8vh}
body.tv .clock{font-size:4.6vh;order:-1}
body.tv #btnHub,body.tv #btnAuth,body.tv #btnLang,body.tv #btnTime,body.tv #btnQR,body.tv #btnAw,body.tv #btnDay{display:none!important}
body.tv .tools{flex-wrap:nowrap;gap:1vh}
body.tv .btn{font-size:2.8vh;padding:.7vh 1.6vh;border-radius:.8vh;white-space:nowrap}
body.tv main{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
body.tv .rail{display:none}
body.tv .rail{font-size:2.6vh;gap:1.4vh}
body.tv .pbtn{font-size:2.9vh}
body.tv .where{font-size:2.3vh}
body.tv #brk{font-size:5vh}
body.tv #ctl3{right:1.2vh;bottom:1.2vh;gap:.8vh}
body.tv #ctl3 button{min-width:6.4vh;height:6.4vh;font-size:3vh;padding:0 1.2vh;border-radius:1vh}
body.tv #ctl3 button[data-c=u],body.tv #ctl3 button[data-c=d],body.tv #ctl3 button[data-c=in],body.tv #ctl3 button[data-c=out]{display:none}
#tvhint{position:absolute;left:1.2vh;bottom:1.2vh;z-index:2;font-size:2.2vh;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:.8vh;padding:.5vh 1.2vh;pointer-events:none;max-width:60%}
body:not(.tv) #tvhint{display:none}
body.tv #radio{top:1.2vh;bottom:1.2vh;max-height:none;right:max(1.6vh, env(safe-area-inset-right, 0px));width:min(40vw,640px);min-width:300px;font-size:2.8vh;padding:2vh;gap:1.4vh;border-radius:1.6vh}
body.tv #radio .rh h2{font-size:3.6vh}
body.tv #radio .rplay{width:8vh;height:8vh;font-size:3.6vh}
body.tv #radio .rname{font-size:3.4vh}
body.tv #radio .rname small,body.tv #radio .rsec,body.tv #radio .note{font-size:2.2vh}
body.tv #radio .rgo{padding:1.5vh 1vh;border-radius:.8vh}
body.tv #radio .rgo small{font-size:2.2vh}
body.tv #radio .rstar{font-size:3.4vh}
body.tv #radio input[type=search]{font-size:2.6vh;padding:1vh 1.2vh}
#radio .rgo:focus-visible,#radio .rgo:focus{outline:none;background:var(--mark);color:var(--mark-ink)}
#radio .rgo:focus small{color:inherit}
#radio .rpage{display:none;gap:1vh}
body.tv #radio .rpage{display:flex}

/* ---- phone check-in (opened from a station's QR code: ?at=<station>) ---- */

#ci .brand{font-family:var(--display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

#ci .who{display:flex;flex-wrap:wrap;gap:8px}
#ci .who button{font:inherit;font-size:17px;font-weight:600;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:9px 16px;cursor:pointer;min-height:46px}
#ci .who button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#ci .who button small{font-weight:400;opacity:.75;margin-left:6px;font-size:13px}
#ci select,#ci input[type=text]{font:inherit;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box;min-height:48px}

#ci .stop{font:inherit;font-size:17px;font-weight:600;border:2px solid var(--line);border-radius:12px;padding:13px;background:var(--panel);color:var(--ink);cursor:pointer}

#ci.modal{display:flex;position:fixed;inset:0;z-index:27;background:rgba(20,24,22,.5);overflow:auto;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 16px max(12px,env(safe-area-inset-left,0px))}
#ci.modal .cin{position:relative;width:min(600px,100%);background:var(--bg);border-radius:18px;padding:18px 18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.3);margin-top:3vh}
#ci.modal h1{font-size:28px;padding-right:44px}

#ci.modal .done button+button{margin-left:6px}
#ci .hereL{margin:4px 0 0}
#ci .hrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
#ci .hereL h2+.hrow{border-top:0}
#ci .hn{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
#ci .hn b{font:700 18px/1.15 var(--display)}
#ci .hn small{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
#ci .hrow.pz .hn b{color:var(--muted)}
#ci .hb{font:600 15px/1 var(--body);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:12px;min-height:46px;cursor:pointer;white-space:nowrap}
#ci .hrow.pz .hb:not(.end){background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#ci .hb.end{border-color:var(--down);color:var(--down);background:transparent}
#ci .err{color:var(--down);font-weight:600;min-height:1.2em}
#ci .done{background:var(--run);color:#fff;border-radius:12px;padding:18px;margin-top:12px;display:flex;flex-direction:column;gap:6px}
#ci .done.off{background:var(--ink);color:var(--bg)}
#ci .done.wait{background:var(--idle)}
#ci .done.bad{background:var(--down)}
#ci .done strong{font-family:var(--display);font-size:26px;line-height:1.1}
#ci .done button{align-self:flex-start;margin-top:6px;font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px 16px;background:rgba(255,255,255,.92);color:#111;cursor:pointer}
#ci .foot{margin-top:18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
#ci .foot a,#ci .foot button{color:var(--muted);background:none;border:0;font:inherit;text-decoration:underline;cursor:pointer;padding:4px 0}

/* ---- time report ---- */
#rep{position:fixed;inset:0;z-index:28;background:rgba(20,24,22,.5);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:auto}
#rep .rbox{background:var(--panel);color:var(--ink);border-radius:14px;width:min(860px,100%);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#rep .rh{display:flex;align-items:center;justify-content:space-between;gap:8px}
#rep h2{font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:.03em;margin:0}
#rep .ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#rep select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
#rep .tot{font-family:var(--display);font-size:20px;font-weight:600}
#rep .tw{overflow-x:auto}

#rep td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}

#rep .note{font-size:13px;color:var(--muted)}

/* ---- QR sheet ---- */
#qrs{position:fixed;inset:0;z-index:29;background:var(--bg);overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
#qrs .qh{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
#qrs .qh h2{font-family:var(--display);font-size:26px;margin:0;text-transform:uppercase;flex:1}
#qrs .qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
#qrs .qc{background:#fff;color:#111;border:2px solid #111;border-radius:10px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative;break-inside:avoid;page-break-inside:avoid}
#qrs .qc.off{opacity:.38}
#qrs .qk{align-self:flex-start;display:flex;gap:6px;align-items:center;font:600 13px/1 var(--body);color:#111;cursor:pointer}
#qrs .qk input{width:18px;height:18px;accent-color:#0D6C66}
#qrs .qc .qn{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05}
#qrs .qc .qi{font-size:13px}
#qrs .qc svg{width:180px;height:180px}
#qrs .qc .qu{font-size:9px;color:#555;word-break:break-all}
#qrs .qc .qx{position:absolute;top:4px;right:4px;border:0;background:none;font-size:18px;cursor:pointer;color:#888}
#qrs .qc .qb{font-size:12px;font-weight:600;color:#111;letter-spacing:.06em;text-transform:uppercase}
@media print{
  @page{size:A4;margin:10mm}
  body.printing>*:not(#qrs){display:none!important}
  body.printing{height:auto;overflow:visible;background:#fff;display:block;padding:0}
  body.printing #qrs{position:static;padding:0;background:#fff;overflow:visible}
  body.printing #qrs .qh,body.printing #qrs .qk,body.printing #qrs .qc.off{display:none!important}
  body.printing #qrs .qgrid{display:block}
  body.printing #qrs .qc{opacity:1;border:0;border-radius:0;height:270mm;padding:12mm 10mm;justify-content:center;gap:9mm;page-break-after:always;break-after:page}
  body.printing #qrs .qc:last-child{page-break-after:auto;break-after:auto}
  body.printing #qrs .qc .qb{font-size:16pt;letter-spacing:.2em}
  body.printing #qrs .qc .qn{font-size:46pt;line-height:1.05}
  body.printing #qrs .qc svg{width:150mm;height:150mm}
  body.printing #qrs .qc .qi{font-size:18pt}
}

/* ===== Look: same family as Reklamos Studija — white panels on cool grey, teal accent,
   Bricolage Grotesque headings, Instrument Sans text, JetBrains Mono for labels, numbers and time ===== */
body{font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px 8px 16px;gap:8px 16px;box-shadow:0 1px 2px rgba(16,19,21,.04)}
h1{font:800 22px/1 var(--display);letter-spacing:-0.02em;text-transform:none}
.counts{font:500 12px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;gap:6px}
.counts span{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:5px 10px 5px 8px;gap:7px}
.dot{width:9px;height:9px}
.d-run{box-shadow:0 0 0 3px color-mix(in srgb,var(--run) 22%,transparent)}
.clock{font:600 20px/1 var(--mono);letter-spacing:-.02em;order:9}
.sync{font:500 11px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase}
@media (max-width:1500px){h1{font-size:19px}.counts{font-size:11px}.clock{font-size:18px}}
.tools{gap:6px}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;line-height:1.2;color:var(--ink);text-decoration:none;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"],#btnRadio.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
#btnTv{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#btnTv:hover{filter:brightness(1.07)}
.mapwrap{border-radius:var(--r);background:var(--well);box-shadow:inset 0 0 0 1px var(--line);border:0}
.rail{gap:12px}
.card{border-radius:var(--r);padding:14px 16px;gap:10px;box-shadow:0 1px 2px rgba(16,19,21,.04)}
.card h2{font:600 11px/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.card summary::after{font:500 18px/1 var(--mono)}
.sub,.note{color:var(--muted)}
.pbtn{font:600 15px/1.3 var(--body)}
.where{font-size:13px}
.btn.sm{padding:5px 10px;font-size:13px}.btn.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
li.idone strong{color:var(--muted)}.badge.done{background:var(--bg);color:var(--muted)}
.badge{background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:1px 8px;font:600 10.5px/1.6 var(--mono);letter-spacing:.05em;text-transform:uppercase}
.d-inst{background:var(--accent)}
input[type=text],input[type=number],input[type=search],select,textarea{border-radius:8px;padding:7px 10px;border-color:var(--line)}
.stbtn{font:600 15px/1.2 var(--display);border-width:1px;border-radius:8px;padding:9px 6px}
.stbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.stsel.on{border-color:var(--accent);color:var(--accent)}
.chip{font:600 14px/1.2 var(--body);background:var(--panel)}
.chip:hover{border-color:var(--accent)}
.x{border-radius:8px}
.pickbar{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pickbar .btn{border-color:var(--accent-ink);color:var(--accent-ink);background:transparent}
.pickbar input{border-color:var(--accent-ink)}
.dragchip{font:600 15px/1 var(--body);background:var(--ink);color:var(--panel);border-radius:99px}
.dragchip.ok{background:var(--accent);color:var(--accent-ink)}
#toast{font:500 14px/1.35 var(--body);border-radius:10px;padding:10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#brk{font:700 22px/1.1 var(--display);letter-spacing:0;text-transform:none;border-radius:99px;padding:8px 22px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.hint3,#tvhint{font:500 11px/1.4 var(--mono);letter-spacing:.03em;border-radius:8px;padding:4px 9px}
#ctl3 button{border-radius:10px;font:600 17px/1 var(--display);box-shadow:0 1px 2px rgba(0,0,0,.06)}
#ctl3 button:hover{border-color:var(--accent)}
#ctl3 button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.fig.sel .bd,.pill.sel rect{fill:var(--accent)}.pill.sel text{fill:var(--accent-ink)}

#aw{position:fixed;inset:0;z-index:28;background:rgba(20,24,22,.5);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:auto}
#aw .rbox{background:var(--panel);color:var(--ink);border-radius:16px;width:min(900px,100%);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#aw .rh{display:flex;align-items:center;justify-content:space-between;gap:8px}
#aw h2{font:800 22px/1.1 var(--display);letter-spacing:-0.01em;margin:0}
#aw .ctl{display:flex;flex-wrap:wrap;gap:8px}
#aw select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#aw .awp{display:flex;flex-direction:column;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
#aw .awp label{font:600 11px/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

const OPS={oproom:[[-70,0],[40,10]],altendorf:[[-100,72],[112,96]],felder:[[-100,72],[112,96]],startech:[[56,-120],[-110,-95]],olimpic:[[-238,30],[238,30]],volter:[[218,92],[-218,0]],booth:[[60,95],[-60,95]],laser:[[-110,8]],desk:[[-138,0],[138,0]],vitap:[[-98,22],[98,22]],blum:[[-76,16],[76,16]],zone:[[-50,0],[50,0]]};
function opAt(ty,T,i){const A=OPS[ty]||[[-(T.w/2+30),0],[T.w/2+30,0]],a=A[i%A.length],k=Math.floor(i/A.length),L=Math.hypot(a[0],a[1])||1;return[a[0]+a[0]/L*k*46,a[1]+a[1]/L*k*46]}

function standAt(it,T,W,H,p,i){if(p&&typeof p.ox==='number'&&typeof p.oy==='number')return[p.ox,p.oy];const o=opAt(it.t,T,i);return[o[0]*W/T.w,o[1]*H/T.h]}

            state:{key:'state',data:clone(DEF_STATE),exists:false,loaded:false,ref:null,q:Promise.resolve()}};

function dayStart(){const d=new Date();d.setHours(0,0,0,0);return d.getTime()}
function normalize(){
  {const l0=docs.layout.data;if(l0&&l0.items)for(const it of Object.values(l0.items))if(it&&it.t==='startech'&&+it.w===330&&+it.h===176){delete it.w;delete it.h}}
  const l=LAY(); if(!isObj(l.hall))l.hall=clone(DEF_LAYOUT.hall); if(!isObj(l.items))l.items={};
  const s=ST(); for(const k of ['st','people','stock','inst'])if(!isObj(s[k]))s[k]={};
  /* New day, clean board: a place set before today no longer counts, so every morning nobody is at a station
     until someone puts them there. Only this screen's copy changes; the next placing saves the new day. */
  {const d0=dayStart();for(const p of Object.values(s.people))if(p&&p.at&&!(+p.ts>=d0)){if(!p.pz)p.pat=p.at;p.at=null;p.pz=null}}
  /* after 17:00 the working day is over: places set during the day no longer count (someone who checks in after
     17:00 is working overtime and does show) */
  {const e=dayEndOf(dayStart());if(Date.now()>=e)for(const p of Object.values(s.people))if(p&&p.at&&+p.ts<e){if(!p.pz)p.pat=p.at;p.at=null;p.pz=null}}
  for(const k of ['st','people','stock','inst'])for(const id of Object.keys(s[k]))if(s[k][id]==null)delete s[k][id];
  for(const id of Object.keys(l.items))if(l.items[id]==null)delete l.items[id];
  if(!Array.isArray(s.projects))s.projects=[];
}

/* ---------- time report ---------- */
const RP={open:false,per:'week',by:'p',data:null,busy:false,key:''};
function repRange(per){const d=new Date();d.setHours(0,0,0,0);const day=(d.getDay()+6)%7;let a,b;
  if(per==='today'){a=d.getTime();b=a+864e5}
  else if(per==='yest'){b=d.getTime();a=new Date(d.getFullYear(),d.getMonth(),d.getDate()-1).getTime()}
  else if(per==='week'){a=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day).getTime();b=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day+7).getTime()}
  else if(per==='lweek'){a=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day-7).getTime();b=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day).getTime()}
  else if(per==='month'){a=new Date(d.getFullYear(),d.getMonth(),1).getTime();b=new Date(d.getFullYear(),d.getMonth()+1,1).getTime()}
  else{a=new Date(d.getFullYear(),d.getMonth()-1,1).getTime();b=new Date(d.getFullYear(),d.getMonth(),1).getTime()}
  return[a,b]}
/* time worked between a and b, breaks taken out */
function netMs(a,b){if(!(b>a))return 0;let ms=b-a;const mm=v=>{const x=String(v||'').split(':');return(+x[0]||0)*60+(+x[1]||0)};
  const d=new Date(a);d.setHours(0,0,0,0);
  for(;d.getTime()<b;d.setDate(d.getDate()+1)){const d0=d.getTime();for(const k of breakList()){if(!k||!k.f||!k.t)continue;const s0=d0+mm(k.f)*6e4,s1=d0+mm(k.t)*6e4;ms-=Math.max(0,Math.min(b,s1)-Math.max(a,s0))}}
  return Math.max(0,ms)}
const fmtH=ms=>{const m=Math.round(ms/6e4),h=Math.floor(m/60),r=m%60;return h?(h+' h'+(r?' '+r+' min':'')):r+' min'};
async function sessionsIn(a,b){
  const mons=[];for(const d=new Date(a);d.getTime()<b;d.setMonth(d.getMonth()+1,1)){const k=monKey(d.getTime());if(!mons.includes(k))mons.push(k)}
  const pk=monKey(a-864e5*40);if(!mons.includes(pk))mons.unshift(pk);   /* a stretch can start in the month before */
  const all={};
  try{const rows=await WA.rest('workspaces?id=in.('+mons.map(m=>LOG_PFX+m).join(',')+')&select=data');for(const r of rows||[])if(r&&isObj(r.data)&&isObj(r.data.s))Object.assign(all,r.data.s)}catch(e){}
  for(const x of logQ)all[x.id]=x;
  for(const [pid,p] of Object.entries(ST().people)){const s=sessOf(pid,p);if(s&&!all[s.id])all[s.id]=s}
  for(const [iid,i] of Object.entries(ST().inst))if(i&&!i.done&&i.f<=today())for(const x of instSess(iid,i))if(!all[x.id])all[x.id]=x;
  return Object.values(all).filter(x=>x&&!x.del&&+x.a<b&&+x.b>a).map(x=>{const a1=Math.max(a,+x.a),b1=Math.min(b,+x.b);return Object.assign({},x,{a1,b1,ms:netMs(a1,b1)})}).filter(x=>x.ms>=6e4);
}
async function repLoad(){
  const [a,b]=repRange(RP.per);

}

function awMonths(){const out=[],d=new Date();d.setDate(1);for(let i=0;i<12;i++){out.push(monKey(d.getTime()));d.setMonth(d.getMonth()-1)}return out}

    const d=dayOfMs(x.a1);e.days[d]=(e.days[d]||0)+x.ms;e.ms+=x.ms;e.jobs.add(d+'|'+(x.pr||'')+'|'+(x.sn||x.s));e.list.push(x)}

/* ---------- end of the day on the TV ----------
   16:45: time to tidy up (60 s). At 16:50 and again at 16:56 on working days the TV shows who did the most today (from 2 h of marked work),
   with confetti, for 45 s; any key or tap closes it. Managers can show it any time from the nomination window. */
/* 16:45 tidy-up reminder, 16:50 and 16:56 star of the day */
const CLEAN_AT=[[16,45]],CLEAN_MS=60000,SHOUT_AT=[[16,50],[16,56]],SHOUT_MS=45000,SHOUT_MIN=2*36e5;
let shoutDone={},shoutT=null,shoutAnim=null;
/* Lithuanian vocative for a first name: Nerijus → Nerijau, Mantas → Mantai, Eglė → Egle */
function voc(n){const w=String(n||'').trim().split(/\s+/)[0]||'';
  const R=[[/ius$/,'iau'],[/us$/,'au'],[/ys$/,'y'],[/is$/,'i'],[/as$/,'ai'],[/ė$/,'e']];
  for(const [re,to] of R)if(re.test(w))return w.replace(re,to);return w}
const SHOUT_LINES={lt:['{V}, šiandien gerai pavarei!','{V}, šiandienos čempionas!','Ačiū, {V} – šiandien buvai ugnis!','{V}, šaunus darbas šiandien!','{V}, šiandien tu – dienos MVP!'],
  en:['{N}, great job today!','{N}, today’s champion!','Thanks, {N} – you were on fire today!','{N}, top work today!','{N}, MVP of the day!']};
async function dayBest(){
  const a=dayStart(),list=await sessionsIn(a,Date.now()),by={};
  for(const x of list){const e=by[x.w]=by[x.w]||{id:x.w,n:x.n||(ST().people[x.w]&&ST().people[x.w].n)||'',ms:0,jobs:new Set(),places:new Set()};e.ms+=x.ms;e.jobs.add((x.pr||'')+'|'+(x.sn||x.s));e.places.add(x.sn||x.s)}
  return Object.values(by).filter(e=>e.n&&e.ms>=SHOUT_MIN).sort((p,q)=>q.ms-p.ms||q.jobs.size-p.jobs.size);
}
async function showShout(manual,chain){
  const best=await dayBest();
  if(!best.length){if(manual)toast(t('shNone'));else if(chain)showDaySum();return}
  const top=best[0],d=new Date(),lines=SHOUT_LINES[lang==='en'?'en':'lt'],line=lines[(d.getDate()+d.getMonth()*31)%lines.length].replace('{V}',voc(top.n)).replace('{N}',top.n.split(' ')[0]);
  const also=best.slice(1,4).filter(e=>e.ms>=SHOUT_MIN*1.5).map(e=>e.n);
  $('#sh-box').innerHTML='<div class="shk">'+esc(t('shKicker'))+'</div><div class="shn">'+esc(line)+'</div><div class="shs">'+esc(fmtH(top.ms))+' · '+top.jobs.size+' '+esc(jobsWord(top.jobs.size))+' · '+esc([...top.places].slice(0,3).join(', '))+'</div>'+
    (also.length?'<div class="sha">'+esc(t('shAlso'))+': '+esc(also.join(', '))+' 👏</div>':'')+'<div class="sht">'+esc(t('shClose'))+'</div>';
  const box=$('#shout');box.classList.remove('clean');box.hidden=false;box.classList.remove('in');void box.offsetWidth;box.classList.add('in');
  box.classList.remove('sum');confetti();clearTimeout(shoutT);shoutT=setTimeout(()=>{hideShout();if(chain)showDaySum()},SHOUT_MS);
}
/* 1 darbas, 2–9 darbai, 10–20 / …0 darbų, 21 darbas… */
function jobsWord(n){if(lang==='en')return n===1?'job':'jobs';const d=n%10,dd=n%100;return d===1&&dd!==11?'darbas':d>=2&&d<=9&&!(dd>=12&&dd<=19)?'darbai':'darbų'}
/* end-of-day tidy-up: a calm reminder, no confetti */
function showClean(){
  $('#sh-box').innerHTML='<div class="shk">'+esc(t('clK'))+'</div><div class="shn"><span class="broom" aria-hidden="true">🧹</span> '+esc(t('clH'))+'</div><div class="shs">'+esc(t('clS'))+'</div>'+
    '<div class="clist">'+['clA','clB','clC','clD'].map(k=>'<span>'+esc(t(k))+'</span>').join('')+'</div><div class="sht">'+esc(t('shClose'))+'</div>';
  const box=$('#shout');box.classList.remove('sum');box.classList.add('clean');box.hidden=false;box.classList.remove('in');void box.offsetWidth;box.classList.add('in');

/* what everyone did today, as one screen (after the 16:50 star of the day) */
async function showDaySum(){
  const list=await sessionsIn(dayStart(),Date.now()),by={};
  for(const x of list){const e=by[x.w]=by[x.w]||{n:x.n||'',ms:0,j:{}};e.ms+=x.ms;const k=(x.sn||x.s)+'|'+(x.pr?prLabel(x.pr):'');e.j[k]=(e.j[k]||0)+x.ms}
  const ppl=Object.values(by).filter(e=>e.n).sort((p,q)=>q.ms-p.ms);if(!ppl.length)return;
  let h='<div class="shk">'+esc(t('sumK'))+'</div><div class="shn sm">'+esc(t('sumH'))+'</div><div class="sumg">';
  for(const e of ppl){h+='<div class="sumc"><div class="sumn"><b>'+esc(e.n)+'</b><span>'+esc(fmtH(e.ms))+'</span></div>';
    for(const [k,ms] of Object.entries(e.j).sort((p,q)=>q[1]-p[1]).slice(0,4)){const [pl,pr]=k.split('|');h+='<div class="sumj"><span>'+esc(pl)+(pr?' · '+esc(pr):'')+'</span><span>'+esc(fmtH(ms))+'</span></div>'}
    h+='</div>'}
  $('#sh-box').innerHTML=h+'</div><div class="sht">'+esc(t('sumFix'))+'</div>';

function shoutTick(){

  const due=(h,m)=>{const k=today()+' '+h+':'+m,at=new Date(d).setHours(h,m,0,0);if(shoutDone[k]||Date.now()<at||Date.now()>=at+4*6e4)return false;shoutDone[k]=1;return true};

function confetti(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=$('#sh-cv'),g=cv.getContext('2d'),W=cv.width=innerWidth,H=cv.height=innerHeight,cols=['#0D6C66','#4CC4B9','#f0b400','#ffffff','#ff7b6b','#7fb2ff'];
  const P=[];for(let i=0;i<Math.min(260,Math.round(W*H/7000));i++)P.push({x:Math.random()*W,y:-Math.random()*H*.8,vx:(Math.random()-.5)*2.2,vy:2+Math.random()*3.5,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.25,w:6+Math.random()*8,h:8+Math.random()*12,c:cols[i%cols.length]});
  const t0=performance.now();if(shoutAnim)cancelAnimationFrame(shoutAnim);
  (function fr(){const el=performance.now()-t0;g.clearRect(0,0,W,H);
    for(const p of P){p.x+=p.vx+Math.sin((el/600)+p.r)*.6;p.y+=p.vy;p.r+=p.vr;if(p.y>H+20&&el<9000){p.y=-20;p.x=Math.random()*W}
      g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(el/180+p.r)));g.restore()}
    if(el<14000&&!$('#shout').hidden)shoutAnim=requestAnimationFrame(fr);else{g.clearRect(0,0,W,H);shoutAnim=null}})();
}

         '<div class="err" role="alert">'+esc(PQ.err)+'</div><div class="pq-acts"><button type="button" class="pq-go" data-pq="go">'+esc(t('pqGo'))+'</button>'+

           '<button type="button" class="pq-b end" data-pq="end" data-id="'+esc(id)+'">'+esc(t('ciEnd'))+'</button>':'')+'</div></div>';
    }
    h+='</div>';
  }
  box.innerHTML=h+'</div>';
}
async function pqSave(){
  const id=PQ.open,cur=ST().people[id];if(!cur)return;const st=PQ.st;PQ.err='';
  if(!st||!LAY().items[st]){PQ.err=t('pqNeedSt');renderPQ(true);return}
  const pr=PQ.pr==='__new'?PQ.nw.trim().slice(0,60):PQ.pr==='-'?'':String(PQ.pr||'');
  if(PQ.pr!=='-'&&!pr){PQ.err=t('ciNeedProj');renderPQ(true);return}
  if(!canWrite())return;
  const nt=PQ.nt.trim().slice(0,80),p={people:{}};
  p.people[id]=Object.assign({at:st,ts:moveStamp(id,st,pr,nt),pr,nt,pat:null,pz:null,sn:snOf(st)},cur.at===st?{}:{ox:null,oy:null});
  if(pr){const np=addProject(pr);if(np)p.projects=np;lsSet('cp.lastpr',pr)}else lsSet('cp.lastpr','-');
  PQ.open=null;commit(docs.state,p);
  toast(cur.n+' → '+snOf(st)+(pr?' · '+pr:''));
  if(!(await waitSaved()))toast(t('ciNotSaved'));
}
$('#pq').addEventListener('click',e=>{const b=e.target.closest('[data-pq]');if(!b)return;const k=b.dataset.pq;
  if(k==='open'){const id=b.dataset.id;if(PQ.open===id){PQ.open=null}else{const p=ST().people[id]||{};
      Object.assign(PQ,{open:id,st:p.at&&LAY().items[p.at]?p.at:null,pr:p.at&&p.pr!=null?(p.pr||'-'):(lsGet('cp.lastpr')||''),nw:'',nt:p.at?(p.nt||''):'',err:''})}
    renderPQ(true);if(PQ.open){const c=b.closest('.pq-card');if(c&&c.scrollIntoView)c.scrollIntoView({block:'nearest',behavior:'smooth'})}}
  else if(k==='st'){PQ.st=b.dataset.st;PQ.err='';renderPQ(true)}
  else if(k==='go')pqSave();
  else if(k==='pause'||k==='resume'||k==='end'){PQ.open=null;ciAct(b.dataset.id,k)}});
$('#pq').addEventListener('change',e=>{const el=e.target;
  if(el.id==='pq-pr'){PQ.pr=el.value;PQ.err='';renderPQ(true);if(el.value==='__new'){const n=$('#pq-nw');if(n)n.focus()}}});
$('#pq').addEventListener('input',e=>{const el=e.target;
  if(el.id==='pq-nw')PQ.nw=el.value;else if(el.id==='pq-nt')PQ.nt=el.value;
  else if(el.id==='pq-q'){PQ.q=el.value;renderPQ(true);const q=$('#pq-q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}});
$('#btnPeople').addEventListener('click',()=>pqSet(!pqOn(),true));
/* a phone opens on the people list (unless this phone was switched to the plan); never on the TV or the QR page */
if(!CHK&&!new URLSearchParams(location.search).has('tv')&&matchMedia('(max-width:820px)').matches&&lsGet('cp.phoneView')!=='plan')document.body.classList.add('pq');
renderPQ();

/* ---------- printable QR codes, one per station ---------- */
let qrLib=null;
function loadQR(){if(window.qrcode)return Promise.resolve(window.qrcode);if(qrLib)return qrLib;
  const srcs=['https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js','https://unpkg.com/qrcode-generator@1.4.4/qrcode.js'];
  qrLib=new Promise((res,rej)=>{const go=i=>{if(i>=srcs.length){qrLib=null;return rej()}const sc=document.createElement('script');sc.src=srcs[i];sc.onload=()=>window.qrcode?res(window.qrcode):go(i+1);sc.onerror=()=>go(i+1);document.head.appendChild(sc)};go(0)});return qrLib}
const ciUrl=id=>location.origin+location.pathname+'?at='+encodeURIComponent(id);
function qrSvg(q,url){const c=q(0,'M');c.addData(url);c.make();return c.createSvgTag({cellSize:4,margin:2,scalable:true})}
/* QR cards: tick the ones to print; each prints on its own A4 page, big, without the link text */
let qrSel=null;
try{qrSel=JSON.parse(lsGet('cp.qrsel')||'null')}catch(e){qrSel=null}
async function qrOpen(){
  const box=$('#qrs');let q;try{q=await loadQR()}catch(e){toast(t('qrFail'));return}
  const list=ciPlaces().map(([id,n])=>[id,n,t('qrScan')]).concat([['off','🚪 '+t('ciOffT'),t('qrLeaveS')]]);
  const on=id=>!qrSel||qrSel.includes(id);
  const card=(id,name,sub)=>'<div class="qc'+(on(id)?'':' off')+'" data-qid="'+esc(id)+'"><label class="qk"><input type="checkbox" data-qr="pick"'+(on(id)?' checked':'')+'> '+esc(t('qrPick'))+'</label><div class="qb">Dėdės Baldai</div><div class="qn">'+esc(name)+'</div>'+qrSvg(q,ciUrl(id))+'<div class="qi">'+esc(sub)+'</div></div>';
  let h='<div class="qh"><h2>'+esc(t('qrH'))+'</h2><span class="note" id="qr-n"></span><button type="button" class="btn" data-qr="all">'+esc(t('qrAll'))+'</button><button type="button" class="btn" data-qr="none">'+esc(t('qrNone'))+'</button><button type="button" class="btn ok" data-qr="print">🖨 '+esc(t('qrPrint'))+'</button><button type="button" class="btn" data-qr="close">'+esc(t('qrClose'))+'</button><div class="note" style="flex-basis:100%">'+esc(t('qrHint'))+'</div></div><div class="qgrid">';
  for(const [id,n,sub] of list)h+=card(id,n,sub);
  box.innerHTML=h+'</div>';box.hidden=false;qrCount();
}
function qrCount(){const all=[...document.querySelectorAll('#qrs .qc')],n=all.filter(c=>!c.classList.contains('off')).length;
  $('#qr-n').textContent=t('qrSel')+': '+n+' / '+all.length;const p=document.querySelector('#qrs [data-qr=print]');if(p)p.disabled=!n}
function qrSave(){qrSel=[...document.querySelectorAll('#qrs .qc:not(.off)')].map(c=>c.dataset.qid);lsSet('cp.qrsel',JSON.stringify(qrSel));qrCount()}
$('#btnQR').addEventListener('click',qrOpen);
$('#qrs').addEventListener('change',e=>{const c=e.target;if(c.dataset.qr!=='pick')return;c.closest('.qc').classList.toggle('off',!c.checked);qrSave()});
$('#qrs').addEventListener('click',e=>{const b=e.target.closest('[data-qr]');if(!b||b.dataset.qr==='pick')return;const k=b.dataset.qr;
  if(k==='close'){$('#qrs').hidden=true;$('#qrs').innerHTML=''}
  else if(k==='all'||k==='none'){document.querySelectorAll('#qrs .qc').forEach(c=>{c.classList.toggle('off',k==='none');c.querySelector('input').checked=k==='all'});qrSave()}
  else if(k==='print'){document.body.classList.add('printing');setTimeout(()=>{window.print();setTimeout(()=>document.body.classList.remove('printing'),500)},50)}});
window.addEventListener('afterprint',()=>document.body.classList.remove('printing'));

/* TV remote: ▲▼◀▶ turn the 3D view, OK opens the radio; in the radio ▲▼ pick a station, OK plays it,
   ◀▶ change the volume, Back closes. Play/pause key starts or stops the radio. */
const KEY_BACK=e=>e.key==='Escape'||e.key==='GoBack'||e.key==='BrowserBack'||e.keyCode===4;
window.addEventListener('keydown',e=>{
  if(!tvOn()||e.ctrlKey||e.metaKey||e.altKey||!$('#auth').hidden)return;
  goFull();
  const k=e.key,a=document.activeElement,typing=a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&a.type!=='range';
  if(k==='MediaPlayPause'||k==='MediaPlay'||k==='MediaStop'||k==='MediaPause'){e.preventDefault();if(k==='MediaStop'||k==='MediaPause'){if(RS.playing)togglePlay()}else if(RS.cur)togglePlay();else radioOpen(true);return}
  if(RS.open){
    if(KEY_BACK(e)){e.preventDefault();e.stopPropagation();radioOpen(false);$('#btnRadio').focus();return}
    if(typing&&k!=='ArrowDown'&&k!=='ArrowUp')return;
    if(k==='ArrowDown'||k==='ArrowUp'){
      e.preventDefault();e.stopPropagation();
      const list=[...document.querySelectorAll('#radio .rplay,#radio #r-q,#radio .rgo')].filter(x=>!x.disabled);
      let i=list.indexOf(a);i=i<0?list.findIndex(x=>x.classList.contains('rgo')):i+(k==='ArrowDown'?1:-1);
      i=Math.max(0,Math.min(list.length-1,i));if(list[i]){list[i].focus({preventScroll:true});list[i].scrollIntoView({block:'nearest'})}return}
    if(k==='ArrowLeft'||k==='ArrowRight'){e.preventDefault();e.stopPropagation();AU.volume=Math.max(0,Math.min(1,Math.round((AU.volume+(k==='ArrowRight'?.1:-.1))*10)/10));lsSet('cp.vol',String(AU.volume));$('#r-vol').value=AU.volume;toast(t('rVol')+' '+Math.round(AU.volume*100)+' %');return}
    if(k==='Enter'&&!(a&&$('#radio').contains(a))){e.preventDefault();focusStation();return}
    return}
  if(k==='Enter'&&(!a||a===document.body||$('#mapwrap').contains(a))){e.preventDefault();radioOpen(true);return}
  if(k==='2'||k==='3'){const want=k==='3'?'3d':'2d';if(view!==want)$('#btnView').click();return}
},true);
let fullTried=false;
function goFull(){if(fullTried||!tvOn())return;fullTried=true;try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen){const p=document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}}catch(e){}}
document.addEventListener('pointerdown',()=>{if(tvOn())goFull()},true);
function wake(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}}
function setTv(on,gesture){
  document.body.classList.toggle('tv',on);
  if(on){editing=false;selItem=null;wake();
    if(gesture){try{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
    if(location.hash!=='#tv'){try{location.hash='tv'}catch(e){}}
  }else{
    try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}
    if(location.hash==='#tv'){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){try{location.hash=''}catch(_){}}}
  }
  railDirty=false;render();renderRail();
}
$('#btnTv').addEventListener('click',()=>setTv(!document.body.classList.contains('tv'),true));
window.addEventListener('hashchange',()=>{const want=location.hash==='#tv';if(want!==document.body.classList.contains('tv'))setTv(want,false)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&document.body.classList.contains('tv'))wake()});

let brkKey=null;
let dayKey=dayStart(),eodKey=Date.now()>=dayEndOf(dayStart());
function tick(){shoutTick();{const eod=Date.now()>=dayEndOf(dayStart());if(eod!==eodKey){eodKey=eod;normalize();railDirty=false;render();renderRail()}}if(dayStart()!==dayKey){dayKey=dayStart();normalize();railDirty=false;render();renderRail()}const bk=onBreak(),kk=bk?bk.f+'-'+bk.t:'';if(brkKey!==null&&kk!==brkKey){brkKey=kk;render()}brkKey=kk;const d=new Date();$('#clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
setInterval(tick,10000);tick();
if(location.hash==='#tv')document.body.classList.add('tv');
normalize();applyView();render();boot();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(view==='3d')build3D()});
})();
