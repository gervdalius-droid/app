    commitInvoice();refreshTotals();renderEditor();toast(t('saved'));
  };
  const cp=$('#edCopy');if(cp)cp.onclick=duplicateInvoice;
  const dl=$('#edDel');if(dl)dl.onclick=()=>confirmBox(EDIT.no||'',()=>{
    S.invoices=S.invoices.filter(x=>x.id!==EDIT.id);
    EDIT=null;saveNow();toast(t('deleted'));go('invoices');
  });
}

function renderLines(){
  const showD=S.settings.showDisc;
  /* data-c / data-lab drive the stacked card layout on phones (see CSS) */
  $('#linesBody').innerHTML=(EDIT.lines||[]).map((l,i)=>`
    <tr data-i="${i}">
      <td data-c="name" data-lab="${esc(t('lnName'))}"><input data-k="name" value="${esc(l.name||'')}" list="itemNames" placeholder="${esc(t('lnName'))}"></td>
      <td data-c="qty" data-lab="${esc(t('lnQty'))}"><input data-k="qty" type="number" step="any" value="${l.qty}"></td>
      <td data-c="unit" data-lab="${esc(t('lnUnit'))}"><input data-k="unit" value="${esc(l.unit||'')}"></td>
      <td data-c="price" data-lab="${esc(t('lnPrice'))}"><input data-k="price" type="number" step="any" value="${l.price}"></td>
      ${showD?`<td data-c="disc" data-lab="${esc(t('lnDisc'))}"><input data-k="disc" type="number" step="any" value="${l.disc||0}"></td>`:''}
      <td data-c="vat" data-lab="${esc(t('lnVat'))}"><input data-k="vat" type="number" step="any" value="${l.vat||0}"></td>
      <td class="num" data-c="sum" data-lab="${esc(t('lnSum'))}" data-sum>${money(lineNet(l))}</td>
      <td data-c="del"><button class="icon-btn" data-del title="${esc(t('del'))}">✕</button></td>
    </tr>`).join('')
    +`<datalist id="itemNames">${S.items.map(it=>`<option value="${esc(it.name)}">`).join('')}</datalist>`;

  $$('#linesBody tr').forEach(tr=>{
    const i=+tr.dataset.i;
    tr.querySelectorAll('input').forEach(inp=>{
      inp.oninput=()=>{
        const k=inp.dataset.k;
        EDIT.lines[i][k]=(k==='name'||k==='unit')?inp.value:num(inp.value);
        if(k==='name'){
          /* typing a catalogue name fills unit / price / VAT once */
          const it=S.items.find(x=>x.name===inp.value);
          if(it){
            const row=EDIT.lines[i];
            row.unit=it.unit||row.unit;row.price=num(it.price);
            row.vat=EDIT.type==='simple'?0:num(it.vat);row.itemId=it.id;
            tr.querySelector('[data-k="unit"]').value=row.unit;
            tr.querySelector('[data-k="price"]').value=row.price;
            tr.querySelector('[data-k="vat"]').value=row.vat;
          }
        }
        tr.querySelector('[data-sum]').textContent=money(lineNet(EDIT.lines[i]));
        refreshTotals();
      };
      inp.onkeydown=e=>{
        if(e.key==='Enter'){
          e.preventDefault();
          if(i===EDIT.lines.length-1){EDIT.lines.push(blankLine());renderLines();refreshTotals();
            const rows=$$('#linesBody input[data-k="name"]');rows[rows.length-1].focus();}
          else $$('#linesBody tr')[i+1].querySelector('[data-k="name"]').focus();
        }
      };
    });
    tr.querySelector('[data-del]').onclick=()=>{
      EDIT.lines.splice(i,1);
      if(!EDIT.lines.length)EDIT.lines.push(blankLine());
      renderLines();refreshTotals();
    };
  });
}

function refreshTotals(){
  const c=calc(EDIT),showD=S.settings.showDisc;
  $('#edTotals').innerHTML=`
    ${showD&&c.disc?`<div class="tr"><div class="tl">${esc(t('edDiscount'))}</div><div class="tv">−${money(c.disc)}</div></div>`:''}
    <div class="tr"><div class="tl">${esc(t('edSubtotal'))}</div><div class="tv">${money(c.net)}</div></div>
    ${c.vatRows.filter(v=>v.rate>0).map(v=>`<div class="tr"><div class="tl">${esc(t('edVat'))} ${v.rate}% <span class="muted">(${money(v.base)})</span></div><div class="tv">${money(v.amt)}</div></div>`).join('')}
    <div class="grand"><div class="tl">${esc(t('edTotal'))}</div><div class="tv">${money(c.total)}</div></div>
    ${c.paid?`<div class="tr" style="margin-top:9px"><div class="tl">${esc(t('pdfPaid'))}</div><div class="tv">${money(c.paid)}</div></div>
      <div class="tr"><div class="tl"><b>${esc(t('edDueNow'))}</b></div><div class="tv">${money(c.due)}</div></div>`:''}
    <div class="muted" style="margin-top:9px;font-size:11.5px">${esc(amountWords(c.total))}</div>`;
}

function duplicateInvoice(){
  EDIT=dupInvoice(EDIT);renderEditor();toast(t('copied'));
}
/* A fresh draft with the next number, today's date and no payments. */
function dupInvoice(src){
  const s=S.settings;
  const copy=JSON.parse(JSON.stringify(src));
  copy.id=uid();copy.seq=s.next;copy.no=makeNumber(s.next);
  copy.date=today();copy.dueDate=addDays(today(),copy.term|0);
  copy.status='draft';copy.payments=[];copy.isNew=true;
  copy.lines=(copy.lines||[]).map(l=>({...l,id:uid()}));
  copy.createdAt=new Date().toISOString();
  delete copy.sentAt;delete copy.paidAt;
  return copy;
}

function pickFromCatalogue(){
  const list=S.items.slice().sort((a,b)=>(b.used||0)-(a.used||0)||a.name.localeCompare(b.name,'lt'));
  openModal(t('edAddFromCat'),
    `<div class="tblwrap"><table><thead><tr><th>${esc(t('itemName'))}</th><th>${esc(t('itemUnit'))}</th>
      <th class="num">${esc(t('itemPrice'))}</th><th class="num">${esc(t('itemVat'))}</th></tr></thead><tbody>
      ${list.map(it=>`<tr class="clickable" data-it="${it.id}"><td>${esc(it.name)}</td><td>${esc(it.unit||'')}</td>
        <td class="num">${money(it.price)}</td><td class="num">${num(it.vat)}%</td></tr>`).join('')}
    </tbody></table></div>`,
    `<button class="btn" data-mclose>${esc(t('close'))}</button>`,
    ()=>{$$('#modalBody [data-it]').forEach(tr=>tr.onclick=()=>{
      const it=S.items.find(x=>x.id===tr.dataset.it);
      const last=EDIT.lines[EDIT.lines.length-1];
      const row={id:uid(),name:it.name,qty:1,unit:it.unit||S.settings.unit,price:num(it.price),
                 disc:0,vat:EDIT.type==='simple'?0:num(it.vat),itemId:it.id};
      if(last&&!String(last.name||'').trim()&&!num(last.price))EDIT.lines[EDIT.lines.length-1]=row;
      else EDIT.lines.push(row);
      closeModal();renderLines();refreshTotals();
    });});
}

/* ===================== payments ===================== */
function paymentsModal(inv){
  const draw=()=>{
    const c=calc(inv);
    $('#modalBody').innerHTML=`
      <div class="grid3" style="align-items:end">
        <label class="f"><span class="l">${esc(t('payDate'))}</span><input type="date" id="pDate" value="${today()}"></label>
        <label class="f"><span class="l">${esc(t('payAmount'))}</span><input type="number" step="any" id="pAmt" value="${c.due>0?c.due:''}"></label>
        <label class="f"><span class="l">${esc(t('payNote'))}</span><input id="pNote"></label>
      </div>
      <div class="btnrow" style="margin:12px 0"><button class="btn primary sm" id="pAdd">${esc(t('payAdd'))}</button>
        <span class="muted">${esc(t('payRest'))} <b class="mono">${money(c.due)}</b></span></div>
      ${(inv.payments||[]).length?`<div class="tblwrap"><table><thead><tr><th>${esc(t('payDate'))}</th>
        <th class="num">${esc(t('payAmount'))}</th><th>${esc(t('payNote'))}</th><th></th></tr></thead><tbody>
        ${inv.payments.map(p=>`<tr><td class="mono">${esc(fmtDate(p.date))}</td><td class="num">${money(p.amount)}</td>
          <td>${esc(p.note||'')}</td><td><button class="icon-btn" data-pd="${p.id}">✕</button></td></tr>`).join('')}
        </tbody></table></div>`:`<div class="empty">${esc(t('payNone'))}</div>`}`;
    $('#pAdd').onclick=()=>{
      const a=num($('#pAmt').value);
      if(!a){toast(t('payAmount'),true);return;}
      inv.payments=inv.payments||[];
      inv.payments.push({id:uid(),date:$('#pDate').value||today(),amount:a,note:$('#pNote').value});
      if(inv.status==='draft')inv.status='sent';
      commitInvoice();draw();refreshTotals();
    };
    $$('#modalBody [data-pd]').forEach(b=>b.onclick=()=>{
      inv.payments=inv.payments.filter(p=>p.id!==b.dataset.pd);
      commitInvoice();draw();refreshTotals();
    });
  };
  openModal(t('payTitle'),'',`<button class="btn primary" data-mclose>${esc(t('close'))}</button>`,()=>{
    draw();
    $('#modalFoot').querySelectorAll('[data-mclose]').forEach(b=>b.onclick=()=>{closeModal();renderEditor();});
  });
}
</script>

<script>
/* =========================================================================
   Buyer picker — ONE box that searches saved customers first and the whole
   Lithuanian company registry underneath, so a new buyer normally costs one
   keystroke sequence and one click, with no separate "add customer" step.
   ========================================================================= */
function bindBuyerBox(){
  const q=$('#buyerQ');
  if(q){
    attachBuyerCombo(q,$('#buyerMenu'));
    $('#buyerManual').onclick=()=>customerModal(null,c=>setBuyer(c));
    $('#buyerRegistry').onclick=()=>registryModal(r=>{
      const c=customerFromRegistry(r);S.customers.push(c);saveNow();setBuyer(c);
    });
  }else{
    $('#buyerChange').onclick=()=>{EDIT.buyer=null;EDIT.customerId=null;
      $('#buyerBox').innerHTML=buyerCardHtml();bindBuyerBox();$('#buyerQ').focus();};
    $('#buyerEdit').onclick=()=>{
      const saved=S.customers.find(c=>c.id===EDIT.customerId);
      customerModal(saved||EDIT.buyer,c=>setBuyer(c));
    };
  }
}
/* =========================================================================
   Hand-off intake — a finished job arrives from another CraftOS app.

     ?from=shopflow|crm|offer&client=…&project=…&qty=…&price=…&ref=…&ws=…

   It opens a DRAFT invoice with the buyer and one line already filled in.
   Nothing is numbered, sent or saved on the customer's behalf: it is the same
   draft they would have typed, minus the typing. A name that matches a saved
   customer reuses that record (so terms and VAT code come with it); anything
   else becomes a one-off buyer they can save from the editor.
   ========================================================================= */
function consumeHandoff(){
  let q; try{ q=new URLSearchParams(location.search); }catch(e){ return; }
  const from=(q.get('from')||'').trim();
  if(!from) return;
  /* strip it so a refresh cannot raise the same invoice twice */
  history.replaceState(null,'',location.pathname+location.hash);

  const client=(q.get('client')||'').trim();
  const project=(q.get('project')||'').trim();
  const ref=(q.get('ref')||'').trim();
  const qty=num(q.get('qty'))||1;
  const price=num(q.get('price'))||0;

  newInvoice();
  if(!EDIT) return;

  if(client){
    const want=deacc(client.toLowerCase());
    const found=(S.customers||[]).find(c=>deacc(String(c.name||'').toLowerCase())===want);
    if(found) setBuyerData(found);
    else EDIT.buyer={name:client,code:'',vat:'',address:'',email:'',phone:'',
                     contact:'',note:'',kind:'company'};
  }
  const line=EDIT.lines[0]||blankLine();
  if(project||ref) line.name=project||ref;
  line.qty=qty;
  if(price) line.price=price;
  EDIT.lines[0]=line;
  if(ref) EDIT.notes=((EDIT.notes||'')+(EDIT.notes?' · ':'')+ref).trim();

  render();
  toast(t('handoffFrom').replace('{app}',from.charAt(0).toUpperCase()+from.slice(1)));
}

/* setBuyer() also repaints the editor DOM, which does not exist yet while a
   hand-off is being assembled — this is the data half on its own. */
function setBuyerData(c){
  EDIT.customerId=c.id||null;
  EDIT.buyer={name:c.name,code:c.code||'',vat:c.vat||'',address:c.address||'',
              email:c.email||'',phone:c.phone||'',contact:c.contact||'',note:c.note||'',
              kind:c.kind||'company'};
  if(c.term!=null&&c.term!==''){EDIT.term=num(c.term);EDIT.dueDate=addDays(EDIT.date,EDIT.term);}
}

function setBuyer(c){
  EDIT.customerId=c.id||null;
  EDIT.buyer={name:c.name,code:c.code||'',vat:c.vat||'',address:c.address||'',
              email:c.email||'',phone:c.phone||'',contact:c.contact||'',note:c.note||'',
              kind:c.kind||'company'};
  if(c.term!=null&&c.term!==''){EDIT.term=num(c.term);EDIT.dueDate=addDays(EDIT.date,EDIT.term);}
  const due=$('#edDue');if(due)due.value=EDIT.dueDate;
  $('#buyerBox').innerHTML=buyerCardHtml();
  bindBuyerBox();
}

function attachBuyerCombo(input,menu){
  let hi=-1,opts=[],timer=null;
  const closeM=()=>{menu.classList.remove('on');hi=-1;};
  const draw=()=>{
    const q=input.value.trim();
    const nq=normQ(q);
    opts=[];
    let html='';
    if(nq.length>=1){
      const saved=S.customers.filter(c=>normQ(c.name+' '+(c.code||'')+' '+(c.address||'')).includes(nq)).slice(0,6);
      if(saved.length){
        html+=`<div class="head-opt">${esc(t('savedCustomers'))}</div>`;
        saved.forEach(c=>{
          opts.push({kind:'cust',c});
          html+=`<div class="opt" data-i="${opts.length-1}"><div class="t">${esc(c.name)}</div>
            <div class="s">${esc([c.code,c.vat,(c.address||'').split(',')[0]].filter(Boolean).join(' · '))}</div></div>`;
        });
      }
    }
    if(nq.length>=3){
      if(REG.state==='ready'){
        const hits=REG.search(q,14);
        if(hits.length){
          html+=`<div class="head-opt">${esc(t('registryResults'))}</div>`;
          hits.forEach(r=>{
            opts.push({kind:'reg',r});
            const tag=r.status?`<span class="tag bad">${esc(r.status)}</span>`
                    :(r.vat?'<span class="tag reg">PVM</span>':'');
            html+=`<div class="opt" data-i="${opts.length-1}">${tag}<div class="t">${esc(r.name)}</div>
              <div class="s">${esc([r.code,r.vat,r.address].filter(Boolean).join(' · '))}</div></div>`;
          });
        }else if(!opts.length){
          html+=`<div class="opt muted">${esc(t('regNoRes'))}</div>`;
        }
      }else if(REG.state==='loading'){
        html+=`<div class="opt muted">${esc(t('regLoading'))}</div>`;
      }else{
        opts.push({kind:'load'});
        html+=`<div class="opt" data-i="${opts.length-1}"><div class="t">⤓ ${esc(t('regLoad'))}</div>
          <div class="s">${esc(t('regTitle'))} · 6.4 MB · ${esc(t('regSize'))}</div></div>`;
      }
    }else if(nq.length&&!opts.length){
      html+=`<div class="opt muted">${esc(t('regTypeMore'))}</div>`;
    }
    if(!html){closeM();return;}
    menu.innerHTML=html;
    menu.classList.add('on');
    menu.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>pick(+el.dataset.i));
  };
  const pick=i=>{
    const o=opts[i];if(!o)return;
    if(o.kind==='load'){
      closeM();
      loadRegistryWithProgress().then(ok=>{if(ok){draw();input.focus();}});
      return;
    }
    if(o.kind==='cust'){closeM();setBuyer(o.c);return;}
    const c=customerFromRegistry(o.r);
    S.customers.push(c);saveNow();
    closeM();setBuyer(c);
  };
  input.oninput=()=>{clearTimeout(timer);timer=setTimeout(draw,140);};
  input.onfocus=()=>{if(REG.state==='idle')REG.loadIfCached().then(ok=>{if(ok&&input.value.trim().length>=3)draw();});draw();};
  input.onkeydown=e=>{
    const cells=Array.from(menu.querySelectorAll('[data-i]'));
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      if(!cells.length)return;
      hi=Math.max(0,Math.min(cells.length-1,hi+(e.key==='ArrowDown'?1:-1)));
      cells.forEach((c,n)=>c.classList.toggle('hi',n===hi));
      cells[hi].scrollIntoView({block:'nearest'});
    }else if(e.key==='Enter'){
      e.preventDefault();
      if(hi>=0&&cells[hi])pick(+cells[hi].dataset.i);
      else if(cells.length===1)pick(+cells[0].dataset.i);
    }else if(e.key==='Escape')closeM();
  };
  /* re-rendering the buyer box detaches this menu; the listener drops itself
     rather than piling up one dead handler per "Keisti" click */
  const onDocClick=ev=>{
    if(!menu.isConnected){document.removeEventListener('click',onDocClick,true);return;}
    if(!menu.parentElement.contains(ev.target))closeM();
  };
  document.addEventListener('click',onDocClick,true);
}

/* Full-screen registry browser (also reachable from the customers tab). */
function registryModal(onPick){
  openModal(t('regTitle'),
    `<div class="note" style="margin-bottom:12px">${esc(t('regHint'))}</div>
     <input id="regQ" placeholder="${esc(t('regPh'))}" autocomplete="off">
     <div id="regStatus" style="margin-top:10px"></div>
     <div id="regList" style="margin-top:10px"></div>`,
    `<button class="btn" data-mclose>${esc(t('close'))}</button>`,
    ()=>{
      const status=$('#regStatus'),list=$('#regList'),q=$('#regQ');
      const paint=()=>{
        if(REG.state==='ready'){
          const m=REG.meta;
          status.innerHTML=`<span class="pill">✓ ${esc(t('regLoaded'))}${m?` · ${m.companies.toLocaleString('lt-LT')} ${esc(t('regCompanies'))} · ${m.withVat.toLocaleString('lt-LT')} ${esc(t('regWithVat'))}`:''}</span>`;
        }else if(REG.state==='loading'){
          status.innerHTML=`<div class="muted">${esc(t('regLoading'))}</div><div class="prog"><i id="regBar"></i></div>`;
        }else if(REG.state==='error'){
          status.innerHTML=`<div class="note warn">${esc(t('regUnavail'))}</div>`;
        }else{
          status.innerHTML=`<button class="btn primary sm" id="regLoadBtn">⤓ ${esc(t('regLoad'))} (6.4 MB)</button>`;
          $('#regLoadBtn').onclick=()=>{loadRegistryWithProgress(p=>{
            const bar=$('#regBar');if(bar)bar.style.width=Math.round(p*100)+'%';
            if(!bar)paint();
          }).then(()=>{paint();search();});paint();};
        }
      };
      const search=()=>{
        const v=q.value.trim();
        if(REG.state!=='ready'){list.innerHTML='';return;}
        if(normQ(v).length<3){list.innerHTML=`<div class="empty">${esc(t('regTypeMore'))}</div>`;return;}
        const hits=REG.search(v,40);
        list.innerHTML=hits.length?`<div class="tblwrap"><table><thead><tr>
            <th>${esc(t('custName'))}</th><th>${esc(t('custCode'))}</th><th>${esc(t('custVat'))}</th>
            <th>${esc(t('custAddr'))}</th></tr></thead><tbody>
            ${hits.map(r=>`<tr class="clickable" data-code="${esc(r.code)}">
              <td>${esc(r.name)}${r.status?` <span class="pill over">${esc(r.status)}</span>`:''}</td>
              <td class="mono">${esc(r.code)}</td><td class="mono">${esc(r.vat||'—')}</td>
              <td class="muted">${esc(r.address)}</td></tr>`).join('')}
          </tbody></table></div>`:`<div class="empty">${esc(t('regNoRes'))}</div>`;
        list.querySelectorAll('[data-code]').forEach(tr=>tr.onclick=()=>{
          const r=hits.find(x=>x.code===tr.dataset.code);
          closeModal();onPick(r);
        });
      };
      let tm=null;
      q.oninput=()=>{clearTimeout(tm);tm=setTimeout(search,140);};
      paint();
      if(REG.state==='idle')REG.loadIfCached().then(ok=>{paint();if(ok)search();});
      q.focus();
    });
}
function loadRegistryWithProgress(onP){
  const ok=REG.load(onP||(()=>{}));
  return ok.then(done=>{
    if(!done)toast(t('regUnavail'),true);
    return done;
  });
}
</script>

<script>
/* =========================================================================
   Važtaraštis — the Lithuanian consignment note that travels with the goods.

   Three parties (siuntėjas / vežėjas / gavėjas), a route, the vehicle and
   driver, the cargo itself and three signature lines. Everything the Kelių
   transporto kodeksas 29 str. and the vidaus vežimo taisyklės ask for.

   The fast path is "make one from an invoice": the seller becomes the
   consignor, the buyer the consignee and the invoice lines become cargo.
   ========================================================================= */
let WB=null;                       /* waybill open in the editor */
let wbFilter={q:'',open:false};

function blankWbLine(){
  return {id:uid(),name:'',code:'',unit:S.settings.unit||'vnt',qty:1,packs:1,weight:0,value:0};
}
function newWaybill(from){
  const s=S.settings;
  WB={
    id:uid(),seq:s.wbNext,no:makeWbNumber(s.wbNext),
    date:today(),place:s.wbPlace||'',
    invoiceId:null,
    consignor:partyOf(S.seller),
    consignee:null,
    carrier:partyOf(S.seller),carrierSelf:true,
    loadAddr:S.seller.address||'',loadDate:today(),
    unloadAddr:'',unloadDate:'',
    vehicle:'',trailer:'',drivers:[{name:S.seller.director||'',doc:''}],
    lines:[blankWbLine()],
    notes:s.wbNote||'',
    status:'draft',deliveredAt:'',receivedBy:'',
    isNew:true
  };
  if(from)fillWbFromInvoice(WB,from);
  go('waybill');
}
function partyOf(o){
  return {name:o.name||'',code:o.code||'',vat:o.vat||'',address:o.address||'',
          phone:o.phone||'',email:o.email||'',contact:o.contact||''};
}
/* Invoice -> waybill. Quantities carry over; weight is left to the user
   because an invoice never knows it. */
function fillWbFromInvoice(wb,inv){
  wb.invoiceId=inv.id;
  wb.consignee=Object.assign(partyOf(inv.buyer||{}),{});
  wb.unloadAddr=(inv.buyer&&inv.buyer.address)||'';
  wb.notes=[wb.notes,inv.no?(LANG==='lt'?'Pagal sąskaitą ':'Per invoice ')+inv.no:''].filter(Boolean).join('\n');
  const lines=(inv.lines||[]).filter(l=>String(l.name||'').trim());
  if(lines.length)wb.lines=lines.map(l=>({
    id:uid(),name:l.name,code:'',unit:l.unit||S.settings.unit||'vnt',
    qty:num(l.qty),packs:0,weight:0,value:r2(lineNet(l))}));
  return wb;
}
function openWaybill(id){
  const w=S.waybills.find(x=>x.id===id);
  if(!w)return;
  WB=JSON.parse(JSON.stringify(w));WB.isNew=false;
  go('waybill');
}
/* Same route, cargo and crew under the next number; dates restart today. */
function dupWaybill(src){
  const s=S.settings,copy=JSON.parse(JSON.stringify(src));
  copy.id=uid();copy.seq=s.wbNext;copy.no=makeWbNumber(s.wbNext);
  copy.date=today();copy.loadDate=today();copy.unloadDate='';
  copy.status='draft';copy.deliveredAt='';copy.receivedBy='';copy.invoiceId=null;
  copy.lines=(copy.lines||[]).map(l=>({...l,id:uid()}));
  copy.drivers=wbDrivers(copy).map(d=>({...d}));
  delete copy.driver;delete copy.driverDoc;
  copy.isNew=true;
  return copy;
}
/* Always an array, tolerating a legacy single-driver document. */
function wbDrivers(w){
  if(Array.isArray(w.drivers))return w.drivers;
  return (w.driver||w.driverDoc)?[{name:w.driver||'',doc:w.driverDoc||''}]:[];
}
function wbDriverNames(w){return wbDrivers(w).map(d=>d.name).filter(Boolean).join(', ');}
function wbDriverDocs(w){return wbDrivers(w).map(d=>d.doc).filter(Boolean).join(', ');}
function wbTotals(w){
  const L=w.lines||[];
  return {packs:L.reduce((s,l)=>s+num(l.packs),0),
          weight:r2(L.reduce((s,l)=>s+num(l.weight),0)),
          value:r2(L.reduce((s,l)=>s+num(l.value),0)),
          qty:r2(L.reduce((s,l)=>s+num(l.qty),0))};
}
function wbStatus(w){return w.status==='delivered'?'delivered':(w.status==='draft'?'draft':'issued');}
const WB_STATUS_LABEL={draft:'wbStatusDraft',issued:'wbStatusIssued',delivered:'wbStatusDelivered'};
const WB_STATUS_PILL={draft:'draft',issued:'sent',delivered:'paid'};

function commitWaybill(){
  if(!WB)return false;
  if(!WB.consignee||!WB.consignee.name){toast(t('wbNoConsignee'),true);return false;}
  if(!(WB.lines||[]).some(l=>String(l.name||'').trim())){toast(t('wbNoLines'),true);return false;}
  const copy=JSON.parse(JSON.stringify(WB));
  delete copy.isNew;
  const ix=S.waybills.findIndex(x=>x.id===copy.id);
  if(ix>=0)S.waybills[ix]=copy;
  else{
    S.waybills.push(copy);
    if(copy.seq>=S.settings.wbNext)S.settings.wbNext=copy.seq+1;
  }
  WB.isNew=false;
  saveNow();
  return true;
}

   needs its own licence number on the note. */
function renderWbDrivers(){
  const box=$('#wbDriverRows');if(!box)return;
  const list=wbDrivers(WB);
  WB.drivers=list;
  box.innerHTML=list.map((d,i)=>`
    <div class="grid2 wb-drv" style="margin-bottom:9px;align-items:end">
      <label class="f"><span class="l">${esc(t('wbDriver'))} ${list.length>1?(i+1):''}</span>
        <input data-wd="${i}.name" value="${esc(d.name||'')}" placeholder="${esc(t('setDriverName'))}"></label>
      <div style="display:flex;gap:8px;align-items:end">
        <label class="f grow"><span class="l">${esc(t('wbDriverDoc'))}</span>
          <input data-wd="${i}.doc" value="${esc(d.doc||'')}" class="mono"></label>
        <button class="icon-btn" data-wdd="${i}" title="${esc(t('del'))}">✕</button>
      </div>
    </div>`).join('')
    +`<button class="btn sm" id="wbAddDriver">${esc(t('wbAddDriver'))}</button>`;
  box.querySelectorAll('[data-wd]').forEach(inp=>inp.oninput=()=>{
    const [i,k]=inp.dataset.wd.split('.');
    WB.drivers[+i][k]=inp.value;
  });
  box.querySelectorAll('[data-wdd]').forEach(b=>b.onclick=()=>{
    WB.drivers.splice(+b.dataset.wdd,1);
    renderWbDrivers();
  });
  $('#wbAddDriver').onclick=()=>{WB.drivers.push({name:'',doc:''});renderWbDrivers();
    const r=box.querySelectorAll('[data-wd$=".name"]');r[r.length-1].focus();};
}

  $$('#wbBody tr').forEach(tr=>{

          <td class="num">${tt2.value?money(tt2.value):'—'}</td><td></td></tr>`;

function bindWaybill(){
  const bind=(id,key,ev)=>{const el=$('#'+id);if(el)el[ev||'oninput']=()=>{WB[key]=el.value;};};
  $('#wbBack').onclick=()=>{WB=null;go('waybills');};
  bind('wbNo','no');bind('wbPlace','place');
  bind('wbLoadAddr','loadAddr');bind('wbUnloadAddr','unloadAddr');
  bind('wbVehicle','vehicle');bind('wbTrailer','trailer');
  bind('wbNotes','notes');
  ['wbDate','wbLoadDate','wbUnloadDate'].forEach(id=>{
    const el=$('#'+id);if(!el)return;
    const key={wbDate:'date',wbLoadDate:'loadDate',wbUnloadDate:'unloadDate'}[id];
    el.onchange=()=>{WB[key]=el.value;};
  });
  const rv=$('#wbRecv');if(rv)rv.oninput=()=>{WB.receivedBy=rv.value;};
  const da=$('#wbDelAt');if(da)da.onchange=()=>{WB.deliveredAt=da.value;};

  const gi=$('#wbGoInv');if(gi)gi.onclick=()=>{WB=null;openInvoice(S.waybills.find(x=>x.id)&&null);};
  if(gi)gi.onclick=()=>{const id=WB.invoiceId;WB=null;openInvoice(id);};

  $$('#p-waybill [data-wbedit]').forEach(b=>b.onclick=()=>{
    const which=b.dataset.wbedit;
    customerModal(Object.assign({id:uid()},WB[which]||{}),c=>{
      WB[which]=partyOf(c);
      if(which==='carrier')WB.carrierSelf=false;
      $('#wbBox'+which.charAt(0).toUpperCase()+which.slice(1)).innerHTML=wbPartyCard(which);
      bindWaybill();
    });
  });
  const self=$('#wbSelf');
  if(self)self.onchange=()=>{
    WB.carrierSelf=self.checked;
    if(self.checked)WB.carrier=partyOf(S.seller);
    $('#wbBoxCarrier').innerHTML=wbPartyCard('carrier');
    bindWaybill();
  };
  const cq=$('#wbConsQ');
  if(cq){
    attachPartyCombo(cq,$('#wbConsMenu'),c=>{
      WB.consignee=partyOf(c);
      if(!WB.unloadAddr)WB.unloadAddr=c.address||'';
      const ua=$('#wbUnloadAddr');if(ua)ua.value=WB.unloadAddr;
      $('#wbBoxConsignee').innerHTML=wbPartyCard('consignee');
      bindWaybill();
    });
    $('#wbConsManual').onclick=()=>customerModal(null,c=>{
      S.customers.push(c);saveNow();
      WB.consignee=partyOf(c);
      $('#wbBoxConsignee').innerHTML=wbPartyCard('consignee');bindWaybill();
    });
    $('#wbConsReg').onclick=()=>registryModal(r=>{
      const c=customerFromRegistry(r);S.customers.push(c);saveNow();
      WB.consignee=partyOf(c);
      if(!WB.unloadAddr)WB.unloadAddr=c.address||'';
      const ua=$('#wbUnloadAddr');if(ua)ua.value=WB.unloadAddr;
      $('#wbBoxConsignee').innerHTML=wbPartyCard('consignee');bindWaybill();
    });
  }
  const fp=$('#wbFleetPick');
  if(fp)fp.onchange=()=>{
    const f=S.fleet.find(x=>x.id===fp.value);if(!f)return;
    WB.vehicle=[f.plate,f.make].filter(Boolean).join(' ');WB.trailer=f.trailer||'';
    $('#wbVehicle').value=WB.vehicle;$('#wbTrailer').value=WB.trailer;fp.value='';
  };
  const dp=$('#wbDriverPick');
  if(dp)dp.onchange=()=>{
    const d=S.drivers.find(x=>x.id===dp.value);if(!d)return;
    const list=wbDrivers(WB);
    /* the picker appends, unless the crew is still one empty placeholder */
    const blank=list.findIndex(x=>!String(x.name||'').trim()&&!String(x.doc||'').trim());
    if(blank>=0)list[blank]={name:d.name,doc:d.doc||''};
    else if(!list.some(x=>x.name===d.name))list.push({name:d.name,doc:d.doc||''});
    WB.drivers=list;renderWbDrivers();dp.value='';
  };
  $('#wbAddLine').onclick=()=>{WB.lines.push(blankWbLine());renderWbLines();
    const r=$$('#wbBody input[data-k="name"]');r[r.length-1]&&r[r.length-1].focus();};
  const fi=$('#wbFromInv');
  if(fi)fi.onclick=()=>{
    const inv=S.invoices.find(i=>i.id===WB.invoiceId);
    if(inv){fillWbFromInvoice(WB,inv);renderWaybill();toast(t('copied'));}
  };
  $('#wbSave').onclick=()=>{if(commitWaybill()){toast(t('saved'));render();}};
  $('#wbPdf').onclick=()=>{if(commitWaybill())printWaybill(WB);};
  const dl=$('#wbDeliver');
  if(dl)dl.onclick=()=>{
    WB.status='delivered';WB.deliveredAt=WB.deliveredAt||today();
    commitWaybill();renderWaybill();toast(t('wbStatusDelivered'));
  };
  const mk=$('#wbMkInv');
  if(mk)mk.onclick=()=>invoiceFromWaybill(WB);
  const cp=$('#wbCopy');
  if(cp)cp.onclick=()=>{WB=dupWaybill(WB);renderWaybill();toast(t('copied'));};
  const dd=$('#wbDel');
  if(dd)dd.onclick=()=>confirmBox(WB.no||'',()=>{
    S.waybills=S.waybills.filter(x=>x.id!==WB.id);
    WB=null;saveNow();toast(t('deleted'));go('waybills');
  });
}

/* Waybill -> invoice, for the "deliver first, bill later" order of work. */
function invoiceFromWaybill(w){
  newInvoice();
  const saved=S.customers.find(c=>c.code&&w.consignee&&c.code===w.consignee.code)
           || S.customers.find(c=>w.consignee&&c.name===w.consignee.name);
  setBuyer(saved||Object.assign({id:null},w.consignee||{}));
  const rate=S.settings.vatPayer?num(S.settings.vatRate):0;

  EDIT.notes=[EDIT.notes,(LANG==='lt'?'Pagal važtaraštį ':'Per waybill ')+w.no].filter(Boolean).join('\n');

/* The consignee picker reuses the invoice buyer combo, minus the buyer-only
   side effects, so registry search works here too. */
function attachPartyCombo(input,menu,onPick){
  let hi=-1,opts=[],timer=null;
  const closeM=()=>{menu.classList.remove('on');hi=-1;};
  const draw=()=>{
    const q=input.value.trim(),nq=normQ(q);
    opts=[];let html='';
    if(nq.length>=1){
      const saved=S.customers.filter(c=>normQ(c.name+' '+(c.code||'')+' '+(c.address||'')).includes(nq)).slice(0,6);
      if(saved.length){
        html+=`<div class="head-opt">${esc(t('savedCustomers'))}</div>`;
        saved.forEach(c=>{opts.push({kind:'cust',c});
          html+=`<div class="opt" data-i="${opts.length-1}"><div class="t">${esc(c.name)}</div>
            <div class="s">${esc([c.code,(c.address||'').split(',')[0]].filter(Boolean).join(' · '))}</div></div>`;});
      }
    }
    if(nq.length>=3){
      if(REG.state==='ready'){
        const hits=REG.search(q,12);
        if(hits.length){
          html+=`<div class="head-opt">${esc(t('registryResults'))}</div>`;
          hits.forEach(r=>{opts.push({kind:'reg',r});
            html+=`<div class="opt" data-i="${opts.length-1}"><div class="t">${esc(r.name)}</div>
              <div class="s">${esc([r.code,r.address].filter(Boolean).join(' · '))}</div></div>`;});
        }else if(!opts.length)html+=`<div class="opt muted">${esc(t('regNoRes'))}</div>`;
      }else if(REG.state==='loading')html+=`<div class="opt muted">${esc(t('regLoading'))}</div>`;
      else{opts.push({kind:'load'});
        html+=`<div class="opt" data-i="${opts.length-1}"><div class="t">⤓ ${esc(t('regLoad'))}</div>
          <div class="s">${esc(t('regTitle'))} · 6.4 MB</div></div>`;}
    }
    if(!html){closeM();return;}
    menu.innerHTML=html;menu.classList.add('on');
    menu.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>pick(+el.dataset.i));
  };
  const pick=i=>{
    const o=opts[i];if(!o)return;
    if(o.kind==='load'){closeM();loadRegistryWithProgress().then(ok=>{if(ok){draw();input.focus();}});return;}
    closeM();
    if(o.kind==='cust'){onPick(o.c);return;}
    const c=customerFromRegistry(o.r);
    S.customers.push(c);saveNow();onPick(c);
  };
  input.oninput=()=>{clearTimeout(timer);timer=setTimeout(draw,140);};
  input.onfocus=()=>{if(REG.state==='idle')REG.loadIfCached().then(ok=>{if(ok&&input.value.trim().length>=3)draw();});draw();};
  input.onkeydown=e=>{
    const cells=Array.from(menu.querySelectorAll('[data-i]'));
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();if(!cells.length)return;
      hi=Math.max(0,Math.min(cells.length-1,hi+(e.key==='ArrowDown'?1:-1)));
      cells.forEach((c,n)=>c.classList.toggle('hi',n===hi));
      cells[hi].scrollIntoView({block:'nearest'});
    }else if(e.key==='Enter'){
      e.preventDefault();
      if(hi>=0&&cells[hi])pick(+cells[hi].dataset.i);
      else if(cells.length===1)pick(+cells[0].dataset.i);
    }else if(e.key==='Escape')closeM();
  };
  const onDocClick=ev=>{
    if(!menu.isConnected){document.removeEventListener('click',onDocClick,true);return;}
    if(!menu.parentElement.contains(ev.target))closeM();
  };
  document.addEventListener('click',onDocClick,true);
}

/* =========================================================================
   Period export — pick a month / week / year / custom range plus document
   types, then take the lot out as one PDF, a ZIP or a CSV.
   ========================================================================= */
function weekStart(d){
  const x=new Date(d+'T00:00:00Z');
  const dow=(x.getUTCDay()+6)%7;           /* Monday = 0, the Lithuanian week */
  x.setUTCDate(x.getUTCDate()-dow);
  return x.toISOString().slice(0,10);
}
function monthStart(iso){return iso.slice(0,8)+'01';}
function addMonths(iso,n){
  const x=new Date(iso+'T00:00:00Z');
  x.setUTCMonth(x.getUTCMonth()+n);
  return x.toISOString().slice(0,10);
}
function periodRange(kind){
  const now=today();
  switch(kind){
    case 'thisWeek':  return {from:weekStart(now),to:addDays(weekStart(now),6)};
    case 'lastWeek':  return {from:addDays(weekStart(now),-7),to:addDays(weekStart(now),-1)};
    case 'thisMonth': return {from:monthStart(now),to:addDays(addMonths(monthStart(now),1),-1)};
    case 'lastMonth': {const m=addMonths(monthStart(now),-1);
                       return {from:m,to:addDays(addMonths(m,1),-1)};}
    case 'thisQuarter':{const q=Math.floor(new Date(now+'T00:00:00Z').getUTCMonth()/3)*3;
                        const f=now.slice(0,5)+String(q+1).padStart(2,'0')+'-01';
                        return {from:f,to:addDays(addMonths(f,3),-1)};}
    case 'thisYear':  return {from:now.slice(0,4)+'-01-01',to:now.slice(0,4)+'-12-31'};
    case 'lastYear':  {const y=+now.slice(0,4)-1;return {from:y+'-01-01',to:y+'-12-31'};}
    default:          return {from:'',to:''};
  }
}
const PERIODS=[['thisMonth','perThisMonth'],['lastMonth','perLastMonth'],
               ['thisWeek','perThisWeek'],['lastWeek','perLastWeek'],
               ['thisQuarter','perThisQuarter'],['thisYear','perThisYear'],
               ['lastYear','perLastYear'],['all','perAll']];

let EXP={kind:'thisMonth',from:'',to:'',types:{invoice:true,simple:true,proforma:true,credit:true},
         status:'all',waybills:false};

function expMatch(){
  const r=EXP.kind==='custom'?{from:EXP.from,to:EXP.to}
        :EXP.kind==='all'?{from:'',to:''}:periodRange(EXP.kind);
  const inRange=d=>(!r.from||d>=r.from)&&(!r.to||d<=r.to);
  const inv=S.invoices.filter(i=>EXP.types[i.type]!==false&&inRange(i.date||'')&&(
    EXP.status==='all'||
    (EXP.status==='unpaid'&&calc(i).due>0.005&&i.status!=='draft')||
    (EXP.status==='paid'&&calc(i).due<=0.005&&i.status!=='draft')||
    (EXP.status==='draft'&&i.status==='draft')
  )).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.seq||0)-(b.seq||0));
  const wbs=EXP.waybills?S.waybills.filter(w=>inRange(w.date||''))
                                   .sort((a,b)=>(a.date||'').localeCompare(b.date||'')):[];
  return {range:r,invoices:inv,waybills:wbs};
}

async function exportPeriodZip(){
  const m=expMatch();
  if(!m.invoices.length&&!m.waybills.length){toast(t('expNothing'),true);return;}
  const root=`saskaitos-${slug(periodLabel())}/`,files=[];
  files.push({name:root+'saskaitos.csv',text:invoiceCsv(m.invoices)});
  m.invoices.forEach(i=>{
    const fn=slug(i.no||i.id);
    files.push({name:root+'saskaitos/'+fn+'.html',text:invoiceHtml(i,{standalone:true})});
    files.push({name:root+'xml/'+fn+'.xml',text:ublXml(i)});
  });
  m.waybills.forEach(w=>files.push({
    name:root+'vaztarasciai/'+slug(w.no||w.id)+'.html',text:waybillHtml(w,{standalone:true})}));
  const blob=await makeZip(files);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=`saskaitos-${slug(periodLabel())}.zip`;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},600);
  toast(t('exportAllDone')+' · '+files.length+' '+t('exportFiles'));
  return files;
}

/* =========================================================================
   Importing invoices from another app.

   MERGES rather than replaces: existing invoices are matched by number and
   left alone, buyers become customers, and the numbering can be carried over
   so the next invoice continues the old sequence instead of restarting.

   Accepts this app's own backup, the JSON that tools/import_pdf.py produces
   from a printed invoice book, and a generic CSV.
   ========================================================================= */
const IMPORT_ALIASES={
  no:['nr','no','numeris','number','serijos numeris','saskaitos nr','saskaitos numeris',
      'invoice','dokumentas'],
  series:['serija','series'],
  date:['data','date','saskaitos data','issue date','israsymo data'],
  due:['terminas','apmoketi iki','due','due date','apmokejimo terminas'],
  buyer:['pirkejas','buyer','klientas','customer','gavejas'],
  code:['imones kodas','im kodas','kodas','company code','reg no'],
  vat:['pvm kodas','pvm moketojo kodas','vat no','vat code'],
  address:['adresas','address'],
  email:['el pastas','elektroninis pastas','email','e mail'],
  item:['pavadinimas','preke','paslauga','description','item'],
  qty:['kiekis','qty','quantity'],
  unit:['matas','mato vnt','vnt','unit'],
  disc:['nuolaida','discount'],
  price:['kaina be pvm','vieneto kaina','price','kaina'],
  net:['suma be pvm','net','suma'],
  rate:['pvm %','pvm proc','vat %','vat rate','tarifas'],
  vatsum:['pvm','pvm suma','vat amount','vat sum'],
  total:['viso su pvm','viso','bendra suma','is viso','total'],
  paid:['apmoketa','sumoketa','paid']
};
/* the payments sheet of an accounting export */
const PAY_ALIASES={
  payDate:['mokejimo data','apmokejimo data','payment date'],
  series:['saskaitos serija','serija'],
  no:['saskaitos serijos numeris','saskaitos numeris','saskaitos nr'],
  kind:['mokejimo tipas','payment type','budas'],
  amount:['sumoketa','apmoketa','amount','paid','suma']
};
function csvRows(text){
  text=text.replace(/^﻿/,'');
  const delim=(text.split('\n')[0].match(/;/g)||[]).length>=(text.split('\n')[0].match(/,/g)||[]).length?';':',';
  const out=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'&&text[i+1]==='"'){cell+='"';i++;}
      else if(ch==='"')q=false;
      else cell+=ch;
    }else if(ch==='"')q=true;
    else if(ch===delim){row.push(cell);cell='';}
    else if(ch==='\n'){row.push(cell);out.push(row);row=[];cell='';}
    else if(ch!=='\r')cell+=ch;
  }
  if(cell||row.length){row.push(cell);out.push(row);}
  return out.filter(r=>r.some(c=>String(c).trim()));
}
const normHead=h=>normQ(h).replace(/[.,()€]/g,'').replace(/%/g,' %')
                          .replace(/\s+/g,' ').trim();
/* Exact matches are taken before prefix ones, and a column answers to one key
   only: "PVM" is a rate and "PVM kodas" a VAT number, and a single pass in
   table order lets the second swallow the first. */
function mapHeaders(head,table){
  table=table||IMPORT_ALIASES;
  const idx={},taken={},cells=(head||[]).map(normHead);
  for(let pass=0;pass<2;pass++)
    for(const key in table){
      if(idx[key]!==undefined)continue;
      for(const raw of table[key]){
        const a=normHead(raw);
        if(!a)continue;
        let hit=-1;
        for(let i=0;i<cells.length;i++){
          if(taken[i])continue;
          if(pass?cells[i].indexOf(a)===0:cells[i]===a){hit=i;break;}
        }
        if(hit>=0){idx[key]=hit;taken[hit]=1;break;}
      }
    }
  return idx;
}
/* Any supported file -> a plain list of invoice objects in this app's shape. */
function parseImportDoc(text,name){
  const trimmed=text.trim();
  if(trimmed.startsWith('{')||trimmed.startsWith('[')){
    let j;try{j=JSON.parse(trimmed);}catch(e){throw new Error(t('impBadJson'));}
    const list=Array.isArray(j)?j:(j.invoices||[]);
    if(!Array.isArray(list)||!list.length)throw new Error(t('impNoInvoices'));
    return {invoices:list.map(normaliseImported),source:(j&&j.source)||name};
  }
  return {invoices:rowsToInvoices(csvRows(text)).map(normaliseImported),source:name};
}
const tidyRate=r=>Math.abs(r-Math.round(r))<0.02?Math.round(r):r2(r);
/* A book can hold two series — "DBSF" invoices and "DBSFIS" išankstinės
   sąskaitos. Only the printed title differs, but a proforma should not read
   as a VAT invoice. */
function markProformas(list){
  const counts={};
  list.forEach(i=>{if(i.series)counts[i.series]=(counts[i.series]||0)+1;});
  const names=Object.keys(counts);
  if(names.length<2)return;
  const main=names.reduce((a,b)=>counts[b]>counts[a]?b:a);
  list.forEach(i=>{if(i.series&&i.series!==main&&/is$/i.test(i.series))i.type='proforma';});
}
/* Rows -> invoices, for a CSV and for a spreadsheet sheet alike.
   One row per line, or one row per invoice: a sheet with no item/quantity
   column is a register, and its money columns are invoice totals — so "Kaina"
   there is the gross, not a unit price. */
function rowsToInvoices(rows){
  if(!rows||rows.length<2)throw new Error(t('impNoInvoices'));
  const idx=mapHeaders(rows[0]);
  if(idx.no===undefined)throw new Error(t('impNoColumn'));
  const cell=(r,k)=>idx[k]===undefined?'':String(r[idx[k]]==null?'':r[idx[k]]).trim();
  const has=(r,k)=>idx[k]!==undefined&&cell(r,k)!=='';
  const lineMode=idx.item!==undefined||idx.qty!==undefined;
  const grossKey=idx.total!==undefined?'total':(lineMode?'':'price');
  const unit=()=>S.settings.unit||'vnt';
  const byNo=new Map(),order=[];
  rows.slice(1).forEach(r=>{
    const number=cell(r,'no');
    if(!number)return;
    const series=cell(r,'series');
    const no=series&&number.indexOf(series)!==0?series+' '+number:number;
    let inv=byNo.get(no);
    if(!inv){
      const code=cell(r,'code');
      inv={no,series,seq:num(String(number).replace(/\D/g,''))||0,
           date:cell(r,'date'),dueDate:cell(r,'due'),
           buyer:{name:cell(r,'buyer'),code,vat:cell(r,'vat'),address:cell(r,'address'),
                  email:cell(r,'email'),phone:'',contact:'',kind:code?'company':'person'},
           lines:[],type:'invoice',currency:cur(),status:'sent',payments:[]};
      byNo.set(no,inv);order.push(inv);
    }
    const rate=has(r,'rate')?num(cell(r,'rate')):null;
    if(lineMode){
      const nm=cell(r,'item'),qty=num(cell(r,'qty')),
            price=num(cell(r,'price')),net=num(cell(r,'net'));
      if(nm||qty||price||net)
        inv.lines.push({name:nm||t('impLineFallback'),qty:qty||1,
                        unit:cell(r,'unit')||unit(),
                        price:price||(qty?r2(net/qty):net),
                        disc:num(cell(r,'disc')),
                        vat:rate==null?num(S.settings.vatRate):rate});
      return;
    }
    const gross=grossKey?num(cell(r,grossKey)):0;
    const vatsum=num(cell(r,'vatsum'));
    let net=has(r,'net')?num(cell(r,'net')):0,rt=rate;
    if(rt==null){
      /* a bare "PVM" column is normally the VAT amount — but if the three
         numbers only add up when it is read as a rate, believe the arithmetic */
      if(net&&vatsum&&gross&&Math.abs(r2(net+vatsum)-gross)>0.02
                        &&Math.abs(r2(net+r2(net*vatsum/100))-gross)<=0.02)rt=vatsum;
      else if(net&&vatsum)rt=tidyRate(vatsum/net*100);
      else rt=num(S.settings.vatRate);
    }
    if(!net&&gross)net=r2(gross/(1+rt/100));
    if(!net&&!gross)return;
    inv.lines.push({name:t('impLineFallback'),qty:1,unit:unit(),
                    price:net,disc:num(cell(r,'disc')),vat:rt});
    /* The book may hold a net back-computed from a round gross, and recomputing
       VAT from it then lands a cent off the document that was actually sent —
       which would leave the invoice a cent short of its own payment forever. */
    if(gross){
      const drift=r2(gross-r2(net+r2(net*rt/100)));
      if(drift)inv.lines.push({name:t('impRounding'),qty:1,unit:unit(),
                               price:drift,disc:0,vat:0});
    }
    if(has(r,'paid')){
      const a=num(cell(r,'paid'));
      if(a)inv.payments.push({date:cell(r,'due')||cell(r,'date'),amount:a,note:''});
    }
  });
  const list=order.filter(i=>i.lines.length);
  if(!list.length)throw new Error(t('impNoInvoices'));
  markProformas(list);
  return list;
}
/* A workbook: one sheet of invoices, optionally one of payments. */
function xlsxInvoices(sheets){
  let book=null,pays=null;
  (sheets||[]).forEach(sh=>{
    const rows=sh.rows||[];
    for(let h=0;h<Math.min(4,rows.length);h++){
      if(!book){
        const idx=mapHeaders(rows[h]);
        if(idx.no!==undefined&&idx.buyer!==undefined
           &&(idx.net!==undefined||idx.total!==undefined||idx.price!==undefined)){
          book={name:sh.name,rows:rows.slice(h)};return;
        }
      }
      if(!pays){
        const idx=mapHeaders(rows[h],PAY_ALIASES);
        if(idx.amount!==undefined&&idx.no!==undefined&&idx.payDate!==undefined){
          pays={name:sh.name,rows:rows.slice(h),idx};return;
        }
      }
    }
  });
  if(!book)throw new Error(t('impNoInvoices'));
  const list=rowsToInvoices(book.rows);
  if(pays){
    const by=new Map();
    list.forEach(i=>by.set(normQ(i.no),i));
    const cell=(r,k)=>pays.idx[k]===undefined?'':String(r[pays.idx[k]]==null?'':r[pays.idx[k]]).trim();
    pays.rows.slice(1).forEach(r=>{
      const number=cell(r,'no');
      if(!number)return;
      const series=cell(r,'series');
      const no=series&&number.indexOf(series)!==0?series+' '+number:number;
      const inv=by.get(normQ(no)),amount=num(cell(r,'amount'));
      if(!inv||!amount)return;
      inv.payments.push({date:cell(r,'payDate')||inv.date,amount,note:cell(r,'kind')});
    });
  }
  return list;
}
/* Fill in whatever the source did not carry, without inventing figures. */
function normaliseImported(raw){
  const b=raw.buyer||{};
  const lines=(raw.lines||[]).map(l=>({
    id:uid(),name:String(l.name||'').trim(),qty:num(l.qty)||0,unit:l.unit||S.settings.unit||'vnt',
    price:num(l.price)||0,disc:num(l.disc)||0,vat:l.vat==null?num(S.settings.vatRate):num(l.vat)}));
  const date=toIso((raw.date||'').slice(0,10))||today();
  /* A register export carries no payment term. Falling back to the invoice
     date would file every unpaid invoice as overdue the moment it lands, so
     use the term this app issues on. */
  const due=toIso((raw.dueDate||'').slice(0,10))
            ||(isIso(date)?addDays(date,S.settings.term|0):date);
  return {
    id:uid(),
    no:String(raw.no||'').trim(),
    series:raw.series||'',
    seq:num(raw.seq)||num(String(raw.no||'').replace(/\D/g,''))||0,
    type:raw.type||'invoice',
    date,
    dueDate:due,
    term:isIso(date)&&isIso(due)?daysBetween(date,due):0,
    buyer:{name:String(b.name||'').trim(),code:String(b.code||'').trim(),vat:String(b.vat||'').trim(),
           address:String(b.address||'').trim(),email:b.email||'',phone:b.phone||'',
           contact:b.contact||'',kind:b.kind||'company',note:b.note||''},
    customerId:null,
    lines:lines.length?lines:[{id:uid(),name:t('impLineFallback'),qty:1,unit:'vnt',price:0,disc:0,vat:0}],
    notes:raw.notes||'',currency:raw.currency||cur(),
    status:raw.status||'sent',
    /* an imported payment carries no id, and the payment list deletes by id */
    payments:(raw.payments||[]).map(p=>({id:uid(),date:toIso(String(p.date||'').slice(0,10))||date,
      amount:num(p.amount),note:p.note||''})).filter(p=>p.amount),
    issuer:raw.issuer||'',receiver:raw.receiver||'',
    imported:true
  };
}
/* "DBSF 0002943" -> "{S} {NNNNNNN}", so the next invoice keeps the old shape
   instead of restarting in this app's default format. */
function inferFormat(no,series){
  if(!no)return '';
  let rest=String(no);
  if(series&&rest.indexOf(series)===0)rest=rest.slice(series.length);
  const m=/^(\D{0,3})(\d+)$/.exec(rest);
  if(!m)return '';
  return '{S}'+m[1]+'{'+'N'.repeat(m[2].length)+'}';
}
function importPlan(list){
  const have=new Set(S.invoices.map(i=>normQ(i.no)));
  const fresh=[],dupes=[];
  list.forEach(i=>{
    if(!i.no||have.has(normQ(i.no)))dupes.push(i);
    else{have.add(normQ(i.no));fresh.push(i);}
  });
  const custKey=b=>b.code?('c:'+b.code):('n:'+normQ(b.name));
  const known=new Set(S.customers.map(c=>c.code?('c:'+c.code):('n:'+normQ(c.name))));
  const newCust=new Map();
  fresh.forEach(i=>{
    const k=custKey(i.buyer);
    if(!i.buyer.name||known.has(k)||newCust.has(k))return;
    newCust.set(k,i.buyer);
  });
  const dates=fresh.map(i=>i.date).filter(Boolean).sort();
  const total=r2(fresh.reduce((s,i)=>s+calc(i).total,0));
  const series=(fresh.find(i=>i.series)||{}).series||'';
  const maxSeq=fresh.reduce((m,i)=>Math.max(m,num(i.seq)||0),0);
  const format=inferFormat((fresh.find(i=>i.no)||{}).no||'',series);
  /* A number we already hold is not a dead end: the file may be a fresher
     export of the same book, carrying payments the invoice here has not seen.
     Matching on date+amount means re-importing the same file is a no-op. */
  const held=new Map();S.invoices.forEach(i=>held.set(normQ(i.no),i));
  const key=p=>String(p.date||'')+'|'+r2(num(p.amount)).toFixed(2);
  const updates=[];
  dupes.forEach(i=>{
    const have=held.get(normQ(i.no));
    if(!have)return;
    const seen=new Set((have.payments||[]).map(key));
    const add=(i.payments||[]).filter(p=>num(p.amount)&&!seen.has(key(p)));
    if(add.length)updates.push({id:have.id,no:have.no,add,
      was:r2(calc(have).due),paid:r2(add.reduce((x,p)=>x+num(p.amount),0))});
  });
  const newPaid=r2(updates.reduce((s,u)=>s+u.paid,0));
  return {fresh,dupes,updates,newPaid,newCust:Array.from(newCust.values()),
          from:dates[0]||'',to:dates[dates.length-1]||'',total,series,maxSeq,format};
}
function applyImport(plan,opts){
  opts=opts||{};
  const custKey=b=>b.code?('c:'+b.code):('n:'+normQ(b.name));
  const index=new Map();
  S.customers.forEach(c=>index.set(c.code?('c:'+c.code):('n:'+normQ(c.name)),c));
  plan.newCust.forEach(b=>{
    const c={id:uid(),kind:b.kind||'company',name:b.name,code:b.code||'',vat:b.vat||'',
             address:b.address||'',email:b.email||'',phone:b.phone||'',contact:'',
             term:null,note:'',src:'import'};
    S.customers.push(c);index.set(custKey(b),c);
  });
  if(opts.syncPayments!==false)(plan.updates||[]).forEach(u=>{
    const inv=S.invoices.find(x=>x.id===u.id);
    if(!inv)return;
    inv.payments=(inv.payments||[]).concat(u.add.map(p=>({id:uid(),date:p.date,
      amount:num(p.amount),note:p.note||''})));
    if(inv.status==='draft')inv.status='sent';
  });
  plan.fresh.forEach(i=>{
    const c=index.get(custKey(i.buyer));
    if(c)i.customerId=c.id;
    if(opts.markPaid&&!(i.payments||[]).length)
      i.payments=[{id:uid(),date:i.dueDate||i.date,amount:calc(i).total,note:t('impMarkedPaid')}];
    S.invoices.push(i);
  });
  if(opts.adoptNumbering&&plan.maxSeq){
    if(plan.series)S.settings.series=plan.series;
    S.settings.next=plan.maxSeq+1;
    if(plan.format)S.settings.format=plan.format;
  }
  saveNow();
}

      <div class="tblwrap" style="max-height:190px;overflow-y:auto">
        <table><thead><tr><th>${esc(t('colNo'))}</th><th class="num">${esc(t('edPayments'))}</th>
          <th class="num">${esc(t('colPaid'))}</th><th class="num">${esc(t('kpiUnpaid'))}</th></tr></thead><tbody>
          ${ups.slice(0,60).map(u=>`<tr><td class="mono">${esc(u.no)}</td>
            <td class="num">${u.add.length}</td><td class="num">${money(u.paid)}</td>
            <td class="num">${money(r2(u.was-u.paid))}</td></tr>`).join('')}
        </tbody></table></div>`:''}`;
    const sy=$('#impSync');if(sy)sy.onchange=e=>{opts.syncPayments=e.target.checked;preview();};
    $('#impNum').onchange=e=>{opts.adoptNumbering=e.target.checked;};
    $('#impPaid').onchange=e=>{opts.markPaid=e.target.checked;};
  };
  const take=file=>{
    srcName=file.name;
    const done=list=>{
      plan=importPlan(list);preview();toast(t('impRead')+' '+list.length);
    };
    const fail=e=>{plan=null;preview();toast(String(e.message||e),true);};
    if(/\.xls$/i.test(file.name)){fail(new Error(t('impOldXls')));return;}
    /* a spreadsheet is read as bytes, everything else as text */
    if(/\.xlsx$/i.test(file.name)||(file.type||'').indexOf('spreadsheetml')>=0){
      $('#impPreview').innerHTML=`<div class="note" style="margin-top:12px">${esc(t('impReading'))}</div>`;
      file.arrayBuffer()
        .then(readXlsx)
        .then(sheets=>done(xlsxInvoices(sheets).map(normaliseImported)))
        .catch(fail);
      return;
    }
    const rd=new FileReader();
    rd.onload=()=>{
      try{done(parseImportDoc(String(rd.result),srcName).invoices);}
      catch(e){fail(e);}
    };
    rd.readAsText(file);
  };
  openModal(t('impTitle'),body(),
    `<button class="btn" data-mclose>${esc(t('cancel'))}</button>
     <button class="btn primary" id="impGo" disabled>${esc(t('impGo'))}</button>`,
    ()=>{
      const drop=$('#impDrop'),file=$('#impFile');
      drop.onclick=()=>file.click();
      file.onchange=e=>{if(e.target.files[0])take(e.target.files[0]);};
      drop.ondragover=e=>{e.preventDefault();drop.classList.add('over');};
      drop.ondragleave=()=>drop.classList.remove('over');
      drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');
        if(e.dataTransfer.files[0])take(e.dataTransfer.files[0]);};
      $('#impGo').onclick=()=>{
        if(!plan||(!plan.fresh.length&&!(plan.updates||[]).length))return;
        const n=plan.fresh.length,u=opts.syncPayments?(plan.updates||[]).length:0;
        applyImport(plan,opts);
        closeModal();render();
        toast((n?t('impDone')+' '+n:'')+(n&&u?' · ':'')+(u?t('impDonePaid')+' '+u:''));
      };
    });
}

/* ===================== exports ===================== */
function download(name,text,mime){
  const blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
}

function importBackup(file){
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const p=JSON.parse(rd.result);
      if(!p||typeof p!=='object'||!('invoices'in p))throw new Error('shape');
      adopt(p);
      saveNow();EDIT=null;go('dash');toast(t('importOk'));
    }catch(e){toast(t('importBad'),true);}
  };
  rd.readAsText(file);
}
function csvOf(head,rows){
  const q=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
  return '﻿'+[head,...rows].map(r=>r.map(q).join(';')).join('\r\n');
}
/* Excel-friendly: semicolon separated + BOM, the shape LT accountants expect. */
function invoiceCsv(list){
  const head=['Nr','Data','Terminas','Pirkejas','Imones kodas','PVM kodas','Suma be PVM','PVM','Viso','Apmoketa','Likutis','Busena','Valiuta'];
  return csvOf(head,list.map(i=>{
    const c=calc(i),b=i.buyer||{};
    return [i.no,i.date,i.dueDate,b.name||'',b.code||'',b.vat||'',
            c.net.toFixed(2),c.vat.toFixed(2),c.total.toFixed(2),c.paid.toFixed(2),c.due.toFixed(2),
            t(STATUS_LABEL[invStatus(i)]),i.currency||cur()];

}

/* EN 16931 / UBL 2.1 — the shape the Lithuanian e-invoice gateway accepts. */
function ublXml(inv){
  const c=calc(inv),s=S.seller,b=inv.buyer||{};
  const x=v=>String(v==null?'':v).replace(/[&<>]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));
  const cy=inv.currency||cur();
  const party=(p,vat)=>`
    <cac:Party>
      <cac:PostalAddress><cbc:StreetName>${x(p.address)}</cbc:StreetName>
        <cac:Country><cbc:IdentificationCode>LT</cbc:IdentificationCode></cac:Country></cac:PostalAddress>
      ${vat?`<cac:PartyTaxScheme><cbc:CompanyID>${x(vat)}</cbc:CompanyID>
        <cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:PartyTaxScheme>`:''}
      <cac:PartyLegalEntity><cbc:RegistrationName>${x(p.name)}</cbc:RegistrationName>
        <cbc:CompanyID>${x(p.code)}</cbc:CompanyID></cac:PartyLegalEntity>
    </cac:Party>`;
  const xml=`<?xml version="1.0" encoding="UTF-8"?>
<Invoice xmlns="urn:oasis:names:specification:ubl:schema:xsd:Invoice-2"
         xmlns:cac="urn:oasis:names:specification:ubl:schema:xsd:CommonAggregateComponents-2"
         xmlns:cbc="urn:oasis:names:specification:ubl:schema:xsd:CommonBasicComponents-2">
  <cbc:CustomizationID>urn:cen.eu:en16931:2017</cbc:CustomizationID>
  <cbc:ID>${x(inv.no)}</cbc:ID>
  <cbc:IssueDate>${x(inv.date)}</cbc:IssueDate>
  <cbc:DueDate>${x(inv.dueDate)}</cbc:DueDate>
  <cbc:InvoiceTypeCode>${inv.type==='credit'?'381':'380'}</cbc:InvoiceTypeCode>
  <cbc:DocumentCurrencyCode>${x(cy)}</cbc:DocumentCurrencyCode>
  ${inv.notes?`<cbc:Note>${x(inv.notes)}</cbc:Note>`:''}
  <cac:AccountingSupplierParty>${party(s,s.vat)}</cac:AccountingSupplierParty>
  <cac:AccountingCustomerParty>${party(b,b.vat)}</cac:AccountingCustomerParty>
  ${(s.banks||[]).filter(k=>k.iban).slice(0,1).map(k=>`<cac:PaymentMeans><cbc:PaymentMeansCode>31</cbc:PaymentMeansCode>
    <cac:PayeeFinancialAccount><cbc:ID>${x(k.iban)}</cbc:ID></cac:PayeeFinancialAccount></cac:PaymentMeans>`).join('')}
  <cac:TaxTotal><cbc:TaxAmount currencyID="${x(cy)}">${c.vat.toFixed(2)}</cbc:TaxAmount>
    ${c.vatRows.map(v=>`<cac:TaxSubtotal>
      <cbc:TaxableAmount currencyID="${x(cy)}">${v.base.toFixed(2)}</cbc:TaxableAmount>
      <cbc:TaxAmount currencyID="${x(cy)}">${v.amt.toFixed(2)}</cbc:TaxAmount>
      <cac:TaxCategory><cbc:ID>${v.rate>0?'S':'Z'}</cbc:ID><cbc:Percent>${v.rate}</cbc:Percent>
        <cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:TaxCategory></cac:TaxSubtotal>`).join('')}
  </cac:TaxTotal>
  <cac:LegalMonetaryTotal>
    <cbc:LineExtensionAmount currencyID="${x(cy)}">${c.net.toFixed(2)}</cbc:LineExtensionAmount>
    <cbc:TaxExclusiveAmount currencyID="${x(cy)}">${c.net.toFixed(2)}</cbc:TaxExclusiveAmount>
    <cbc:TaxInclusiveAmount currencyID="${x(cy)}">${c.total.toFixed(2)}</cbc:TaxInclusiveAmount>
    <cbc:PayableAmount currencyID="${x(cy)}">${c.total.toFixed(2)}</cbc:PayableAmount>
  </cac:LegalMonetaryTotal>
  ${(inv.lines||[]).map((l,i)=>`<cac:InvoiceLine><cbc:ID>${i+1}</cbc:ID>
    <cbc:InvoicedQuantity unitCode="C62">${num(l.qty)}</cbc:InvoicedQuantity>
    <cbc:LineExtensionAmount currencyID="${x(cy)}">${lineNet(l).toFixed(2)}</cbc:LineExtensionAmount>
    <cac:Item><cbc:Name>${x(l.name)}</cbc:Name>
      <cac:ClassifiedTaxCategory><cbc:ID>${num(l.vat)>0?'S':'Z'}</cbc:ID><cbc:Percent>${num(l.vat)}</cbc:Percent>
        <cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:ClassifiedTaxCategory></cac:Item>
    <cac:Price><cbc:PriceAmount currencyID="${x(cy)}">${num(l.price).toFixed(4)}</cbc:PriceAmount></cac:Price>
  </cac:InvoiceLine>`).join('')}
</Invoice>`;
  return xml;
}
function exportUbl(inv){download(`${slug(inv.no)}.xml`,ublXml(inv),'application/xml');}

<script>
/* =========================================================================
   Darbo laiko apskaitos žiniaraštis — one sheet per month, employees down the
   side, days across the top, filled in by hand.

   A cell holds what the paper form holds: hours ("8"), a code ("A"), or both
   ("DP 8"). It is stored as the typed string and parsed on the fly, so a code
   this app has never heard of is kept and counted rather than dropped.
   ========================================================================= */
const TS_CODES=[
  {c:'FD',k:'tsFD',work:true},{c:'VD',k:'tsVD',work:true},
  {c:'DN',k:'tsDN',work:true},{c:'DP',k:'tsDP',work:true},
  {c:'K', k:'tsK', work:true},{c:'KV',k:'tsKV'},
  {c:'A', k:'tsA'},{c:'MA',k:'tsMA'},{c:'NA',k:'tsNA'},
  {c:'G', k:'tsG'},{c:'PV',k:'tsPV'},{c:'L', k:'tsL'},
  {c:'V', k:'tsV'},{c:'P', k:'tsP'},{c:'PB',k:'tsPB'},
  {c:'NN',k:'tsNN'},{c:'ND',k:'tsND'},{c:'PK',k:'tsPK'}
];
const TS_BY_CODE=(()=>{const m={};TS_CODES.forEach(x=>m[x.c]=x);return m;})();
const TS_DOW=['tsMon','tsTue','tsWed','tsThu','tsFri','tsSat','tsSun'];
const TS_DOW_LT=['Pr','An','Tr','Kt','Pn','Št','Sk'];
const TS_DOW_EN=['Mo','Tu','We','Th','Fr','Sa','Su'];

/* Easter drives four Lithuanian public holidays, so it has to be computed
   rather than tabulated — Meeus/Jones/Butcher, Gregorian. */
function easterSunday(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
        f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
        h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,
        l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
        mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return new Date(Date.UTC(y,mo-1,da));
}
const isoOf=d=>d.toISOString().slice(0,10);
/* {ISO date: name} — the statutory list, DK 123 str. */
function ltHolidays(y){
  const H={},put=(iso,lt,en)=>{H[iso]=LANG==='lt'?lt:en;};
  const pad=n=>String(n).padStart(2,'0');
  const ymd=(m,d)=>y+'-'+pad(m)+'-'+pad(d);
  const firstSunday=m=>{const d=new Date(Date.UTC(y,m-1,1));
    d.setUTCDate(1+((7-d.getUTCDay())%7));return isoOf(d);};
  const easter=easterSunday(y);
  put(ymd(1,1),'Naujieji metai','New Year');
  put(ymd(2,16),'Valstybės atkūrimo diena','Restoration of the State');
  put(ymd(3,11),'Nepriklausomybės atkūrimo diena','Restoration of Independence');
  put(isoOf(easter),'Velykos','Easter Sunday');
  put(isoOf(new Date(easter.getTime()+864e5)),'Antroji Velykų diena','Easter Monday');
  put(ymd(5,1),'Darbo diena','Labour Day');
  put(firstSunday(5),'Motinos diena','Mother’s Day');
  put(firstSunday(6),'Tėvo diena','Father’s Day');
  put(ymd(6,24),'Joninės','St John’s Day');
  put(ymd(7,6),'Valstybės diena','Statehood Day');
  put(ymd(8,15),'Žolinė','Assumption Day');
  put(ymd(11,1),'Visų šventųjų diena','All Saints’ Day');
  put(ymd(11,2),'Vėlinės','All Souls’ Day');
  put(ymd(12,24),'Kūčios','Christmas Eve');
  put(ymd(12,25),'Šv. Kalėdos','Christmas Day');
  put(ymd(12,26),'Antroji Kalėdų diena','Boxing Day');
  return H;
}
const tsMonthLen=ym=>new Date(Date.UTC(+ym.slice(0,4),+ym.slice(5,7),0)).getUTCDate();
/* One entry per day of the month: weekday, weekend, holiday, and whether the
   day before a holiday is shortened by an hour (DK 112 str. 6 d.). */
function tsDays(ym){
  const y=+ym.slice(0,4),m=+ym.slice(5,7);
  if(!y||!m)return [];
  const hol=Object.assign(ltHolidays(y),ltHolidays(y+1)),out=[];
  for(let d=1;d<=tsMonthLen(ym);d++){
    const dt=new Date(Date.UTC(y,m-1,d)),iso=isoOf(dt),dow=(dt.getUTCDay()+6)%7;
    const weekend=dow>=5,holiday=hol[iso]||'';
    const work=!weekend&&!holiday;
    out.push({d,iso,dow,weekend,holiday,work,
      short:work&&!!hol[isoOf(new Date(dt.getTime()+864e5))]});
  }
  return out;
}
const tsDowLabel=dow=>(LANG==='lt'?TS_DOW_LT:TS_DOW_EN)[dow];
/* Working days and the hours they add up to, for one daily norm. */
function tsNorm(ym,perDay){
  const h=num(perDay)||num(S.settings.tsHours)||8;
  let days=0,hours=0;
  tsDays(ym).forEach(x=>{if(x.work){days++;hours+=h-(x.short?1:0);}});
  return {days,hours:r2(hours)};
}
/* Somebody hired on the 15th owes nothing for the 1st. Without this every
   mid-month joiner and leaver reads as a hole in the sheet, for ever. */
function tsRowOn(row,iso){
  if(!row)return true;
  if(row.from&&iso<row.from)return false;
  if(row.to&&iso>row.to)return false;
  return true;
}
/* The norm this particular person owes: their own daily hours, over the days
   they were actually employed. */
function tsRowNorm(row,ym){
  const h=num(row&&row.hours)||num(S.settings.tsHours)||8;
  let days=0,hours=0;
  tsDays(ym).forEach(x=>{
    if(!x.work||!tsRowOn(row,x.iso))return;
    days++;hours+=h-(x.short?1:0);
  });
  return {days,hours:r2(hours)};
}
/* Every working day nobody accounted for. An absence code counts as filled —
   the hole is a day with nothing written in it at all. Days still ahead of us
   are not holes: filling September on the 11th should not report twelve.  */
function tsGaps(ts,upTo){
  const limit=upTo===undefined?today():upTo;
  const days=tsDays(ts.month),out=[];
  (ts.rows||[]).forEach((r,i)=>{
    days.forEach(x=>{
      if(!x.work||!tsRowOn(r,x.iso))return;
      if(limit&&x.iso>limit)return;
      if(String((r.days||{})[x.d]||'').trim())return;
      out.push({row:i,day:x.d,name:r.name||''});
    });
  });
  return out;
}
/* The value a stamp writes into one cell. "*" is each employee's own shift for
   that day — an 8 painted across a half-timer's row would be a lie. */
function tsBrushFor(r,d){
  if(tsBrush!=='*')return tsBrush;
  const row=(TS&&TS.rows[r])||null,day=tsDays(TS.month)[d-1];
  if(!day||!day.work)return '';
  const h=num(row&&row.hours)||num(S.settings.tsHours)||8;
  return tsH(h-(day.short?1:0));
}
/* What the dashboard should raise: last month with no sheet at all, or a sheet
   with holes in the days that have already happened. */
function tsDue(){
  if(!S.timesheets.length&&!S.employees.length)return null;
  const now=today(),cur=now.slice(0,7),prev=addMonths(now.slice(0,8)+'01',-1).slice(0,7);
  const sheet=m=>S.timesheets.find(x=>x.month===m);
  const prevSheet=sheet(prev);
  if(!prevSheet&&S.employees.length)return {kind:'missing',month:prev};
  if(prevSheet){
    const g=tsGaps(prevSheet,'');           /* a finished month counts in full */
    if(g.length)return {kind:'gaps',id:prevSheet.id,month:prev,n:g.length};
  }
  const curSheet=sheet(cur);
  if(curSheet){
    const g=tsGaps(curSheet,now);
    if(g.length)return {kind:'gaps',id:curSheet.id,month:cur,n:g.length};
  }
  return null;
}
/* "8" -> 8 hours worked · "A" -> a code, no hours · "DP 8" / "8 DP" -> both */
function tsParse(v){
  const x=String(v==null?'':v).trim();
  if(!x)return null;
  if(/^[0-9]+([.,][0-9]+)?$/.test(x))return {code:'FD',hours:num(x)};
  let m=/^([^0-9\s]{1,4})\s*([0-9]+(?:[.,][0-9]+)?)?$/.exec(x);
  if(m)return {code:m[1].toUpperCase(),hours:m[2]?num(m[2]):0};
  m=/^([0-9]+(?:[.,][0-9]+)?)\s*([^0-9\s]{1,4})$/.exec(x);
  if(m)return {code:m[2].toUpperCase(),hours:num(m[1])};
  return {code:x.toUpperCase().slice(0,4),hours:0};
}
/* An unlisted code still counts as worked when hours were written against it;
   a listed absence code never does. */
const tsWorks=code=>{const k=TS_BY_CODE[code];return k?!!k.work:true;};
function tsRowTotals(row,ym){
  const by={};let hours=0,days=0;
  tsDays(ym).forEach(x=>{
    const p=tsParse((row.days||{})[x.d]);
    if(!p)return;
    const key=p.code||'FD',b=by[key]||(by[key]={hours:0,days:0});
    b.hours=r2(b.hours+p.hours);b.days++;
    if(tsWorks(key)&&p.hours){hours=r2(hours+p.hours);days++;}
  });
  return {hours,days,by};
}
function tsTotals(ts){
  const per={},by={};let hours=0,days=0;
  (ts.rows||[]).forEach(r=>{
    const tt=tsRowTotals(r,ts.month);
    hours=r2(hours+tt.hours);days+=tt.days;
    for(const k in tt.by){
      const b=by[k]||(by[k]={hours:0,days:0});
      b.hours=r2(b.hours+tt.by[k].hours);b.days+=tt.by[k].days;
    }
  });
  tsDays(ts.month).forEach(x=>{
    let h=0;
    (ts.rows||[]).forEach(r=>{const p=tsParse((r.days||{})[x.d]);if(p&&tsWorks(p.code))h=r2(h+p.hours);});
    per[x.d]=h;
  });
  return {hours,days,by,per};
}
const tsLabel=code=>{const k=TS_BY_CODE[code];return k?t(k.k):t('tsOtherCode');};

/* ---------- sheet + employee plumbing ---------- */
function tsBlank(month){
  return {id:uid(),month,dept:S.settings.tsDept||'',no:'',rows:[],note:'',
          madeBy:S.settings.tsMadeBy||'',madeByPos:S.settings.tsMadeByPos||'',
          approvedBy:S.seller.director||'',approvedPos:'',
          createdAt:new Date().toISOString()};
}
function tsRowOf(emp){
  return {empId:emp.id,name:emp.name||'',position:emp.position||'',
          tabNo:emp.tabNo||'',hours:num(emp.hours)||num(S.settings.tsHours)||8,days:{}};
}
function tsCommit(){
  if(!TS)return false;
  const ix=S.timesheets.findIndex(x=>x.id===TS.id);
  const copy=JSON.parse(JSON.stringify(TS));
  if(ix>=0)S.timesheets[ix]=copy;else S.timesheets.push(copy);
  save();
  return true;
}
function openSheet(id){
  const ts=S.timesheets.find(x=>x.id===id);
  if(!ts)return;
  TS=JSON.parse(JSON.stringify(ts));
  go('sheet');
}
function newSheet(){
  const now=today().slice(0,7);
  openModal(t('tsNew'),`
    <div class="grid2">
      <label class="f"><span class="l">${esc(t('tsPickMonth'))}</span>
        <input type="month" id="tsmM" value="${esc(now)}"></label>
      <label class="f"><span class="l">${esc(t('tsNo'))}</span>
        <input id="tsmNo" placeholder="1"></label>
    </div>
    <label class="f" style="margin-top:10px"><span class="l">${esc(t('tsDept'))}</span>
      <input id="tsmDept" value="${esc(S.settings.tsDept||'')}"></label>
    <div class="note" style="margin-top:12px">${esc(t('tsCopyPrev'))}</div>`,
    `<button class="btn" data-mclose>${esc(t('cancel'))}</button>
     <button class="btn primary" id="tsmGo">${esc(t('tsCreate'))}</button>`,
    ()=>{
      $('#tsmGo').onclick=()=>{
        const month=($('#tsmM').value||now).slice(0,7);
        if(S.timesheets.some(x=>x.month===month&&x.dept===($('#tsmDept').value||''))){
          toast(t('tsExists'),true);return;
        }
        const ts=tsBlank(month);
        ts.no=$('#tsmNo').value||'';
        ts.dept=$('#tsmDept').value||'';
        /* carry last month's line-up forward, or fall back to everyone active */
        const prev=S.timesheets.filter(x=>x.month<month).sort((a,b)=>a.month<b.month?1:-1)[0];
        const source=prev&&prev.rows.length
          ? prev.rows.map(r=>S.employees.find(e=>e.id===r.empId)||{id:r.empId,name:r.name,
              position:r.position,tabNo:r.tabNo,hours:r.hours})
          : S.employees.filter(e=>e.active!==false);
        ts.rows=source.map(tsRowOf);
        S.timesheets.push(ts);
        S.settings.tsDept=ts.dept;
        saveNow();closeModal();openSheet(ts.id);
      };

}

/* Copy a sheet into another month (or the same month, another department).
   The line-up, positions and shift hours always come along; the entries
   only on request, matched by day number — a new month's weekends fall on
   other dates, so carrying them by default would plant false hours. */
function tsDupSheet(src,month,dept,withDays){
  const ts=JSON.parse(JSON.stringify(src));
  ts.id=uid();ts.month=month;ts.dept=dept;ts.createdAt=new Date().toISOString();
  const dim=new Date(Date.UTC(+month.slice(0,4),+month.slice(5,7),0)).getUTCDate();
  ts.rows=(ts.rows||[]).map(r=>{
    const days={};
    if(withDays)Object.keys(r.days||{}).forEach(d=>{if(+d<=dim)days[d]=r.days[d];});
    const row={...r,days};
    delete row.from;delete row.to;   /* dates of the old month mean nothing in the new one */
    return row;
  });
  return ts;
}
function tsCopyModal(src){
  const nx=new Date(Date.UTC(+src.month.slice(0,4),+src.month.slice(5,7),1)).toISOString().slice(0,7);

    `<button class="btn" data-mclose>${esc(t('cancel'))}</button>
     <button class="btn primary" id="tscGo">${esc(t('edCopy'))}</button>`,
    ()=>{
      $('#tscGo').onclick=()=>{
        const month=($('#tscM').value||nx).slice(0,7),dept=$('#tscDept').value||'';
        if(S.timesheets.some(x=>x.month===month&&(x.dept||'')===dept)){toast(t('tsExists'),true);return;}
        const ts=tsDupSheet(src,month,dept,$('#tscDays').checked);
        ts.no=$('#tscNo').value||'';
        S.timesheets.push(ts);

      };
    });
}

  openModal(t('tsEmpTitle'),

     <div class="btnrow" style="margin-top:12px">

                          hours:num(S.settings.tsHours)||8,active:true});

<script>
/* ---------- žiniaraščių sąrašas ---------- */
let tsFilter={q:''};
let tsBrush=null;       /* the value being painted, '' erases, null = off */
let tsPainting=false;
let tsGapIx=0;          /* where the "find the next hole" walk has got to */
document.addEventListener('pointerup',()=>{tsPainting=false;});
/* hours read better without trailing zeros: 168, 167,5 */
const tsH=n=>{
  const x=r2(num(n));
  if(!x)return '0';
  const s=(Math.abs(x-Math.round(x))<0.005)?String(Math.round(x)):String(x);
  return LANG==='lt'?s.replace('.',','):s;
};
function renderSheets(){

/* ---------- the grid ---------- */
function tsSummaryHtml(tot){
  const keys=Object.keys(tot.by).sort((a,b)=>tot.by[b].hours-tot.by[a].hours||(a<b?-1:1));
  if(!keys.length)return `<div class="muted">${esc(t('tsNoRowsSub'))}</div>`;
  return `<div class="tblwrap"><table><thead><tr>
    <th style="width:60px">${esc(t('tsCode'))}</th><th>${esc(t('tsLegend'))}</th>

    ${keys.map(k=>`<tr><td class="mono"><b>${esc(k)}</b></td>
      <td>${esc(tsLabel(k))}</td><td class="num">${tot.by[k].days}</td>
      <td class="num">${tsH(tot.by[k].hours)}</td></tr>`).join('')}

}
function tsExpected(ts){
  return r2((ts.rows||[]).reduce((a,r)=>a+tsRowNorm(r,ts.month).hours,0));
}
function paintTsTotals(){
  if(!TS)return;

/* One definition of a hole, used by the counter and by the stripes alike. */
function tsIsGap(row,day,value){
  if(!day||!day.work)return false;
  if(!tsRowOn(row,day.iso))return false;
  if(day.iso>today())return false;
  return !String(value==null?'':value).trim();
}
/* One day against this person's own shift for that day:
   'under' = worked but fewer hours than the shift,
   'over'  = more than the shift, any hours on a rest day / holiday / outside
             their employment dates, or anything marked VD / DP.
   Absence codes (A, L, NA…) are neither — that day owes no hours. */
function tsDayState(row,day,value){
  const p=tsParse(value);
  if(!p||!day||!p.hours||!tsWorks(p.code))return '';
  if(p.code==='VD'||p.code==='DP')return 'over';
  const shift=(day.work&&tsRowOn(row,day.iso))
    ?(num(row&&row.hours)||num(S.settings.tsHours)||8)-(day.short?1:0):0;
  if(p.hours>shift+0.005)return 'over';
  if(p.hours<shift-0.005)return 'under';
  return '';
}
function tsDayCounts(ts){
  const days=tsDays(ts.month),c={under:0,over:0,underH:0,overH:0};
  (ts.rows||[]).forEach(r=>days.forEach(x=>{
    const v=(r.days||{})[x.d],st=tsDayState(r,x,v);
    if(!st)return;
    const p=tsParse(v),h=num(r.hours)||num(S.settings.tsHours)||8;
    const shift=(x.work&&tsRowOn(r,x.iso))?h-(x.short?1:0):0;
    c[st]++;
    if(st==='under')c.underH=r2(c.underH+shift-p.hours);
    else c.overH=r2(c.overH+((p.code==='VD'||p.code==='DP')?p.hours:Math.max(0,p.hours-shift)));
  }));
  return c;
}
function tsLegendHtml(){
  const c=tsDayCounts(TS);
  return `<span><span class="sw under"></span>${esc(t('tsUnder'))}${c.under?`: <b>${c.under} d. · −${tsH(c.underH)} h</b>`:''}</span>
    <span><span class="sw over"></span>${esc(t('tsOver'))}${c.over?`: <b>${c.over} d. · +${tsH(c.overH)} h</b>`:''}</span>`;
}
/* the row total, with its distance from the norm underneath */
function tsRowHoursHtml(row,tt){
  const n=tsRowNorm(row,TS.month).hours,df=r2(tt.hours-n);
  if(!tt.hours)return '';
  return tsH(tt.hours)+(Math.abs(df)>=0.005?`<i>${df>0?'+':'−'}${tsH(Math.abs(df))}</i>`:'');
}
/* red when short of this person's own norm, amber when over it */
function tsRowClass(row,tt){
  const n=tsRowNorm(row,TS.month).hours;
  if(!n&&!tt.hours)return '';
  if(Math.abs(tt.hours-n)<0.005)return 'ok';
  return tt.hours<n?'low':'high';
}
function tsFocus(r,d){
  const el=document.querySelector(`.tsg input[data-r="${r}"][data-d="${d}"]`);
  if(el){el.focus();el.select();}
}
function tsFillRow(i,overwrite){
  const row=TS.rows[i];
  if(!row)return;
  row.days=row.days||{};
  const h=num(row.hours)||num(S.settings.tsHours)||8;
  tsDays(TS.month).forEach(x=>{
    if(!x.work||!tsRowOn(row,x.iso))return;
    if(!overwrite&&String(row.days[x.d]||'').trim())return;
    row.days[x.d]=tsH(h-(x.short?1:0));
  });
}

function tsBrushes(){

             {v:tsH(h),label:tsH(h),title:t('tsFD')},

  ['A','L','NA','DP','K','PB'].forEach(c=>out.push({v:c,label:c,title:tsLabel(c)}));
  out.push({v:'',label:'✕',title:t('tsErase')});
  return out;
}

/* Write one cell and keep the totals honest, without re-rendering the grid —
   a re-render mid-entry would take the cursor with it. */
function tsStamp(r,d,value){
  const row=TS.rows[r];
  if(!row)return;
  row.days=row.days||{};
  const v=String(value==null?'':value).trim();
  if(v)row.days[d]=v;else delete row.days[d];
  const inp=document.querySelector(`.tsg input[data-r="${r}"][data-d="${d}"]`);
  if(inp){
    if(inp.value!==v)inp.value=v;
    const td=inp.closest('td');
    if(td){
      const day=tsDays(TS.month)[d-1],st=tsDayState(row,day,v);
      td.classList.toggle('gap',tsIsGap(row,day,v));
      td.classList.toggle('under',st==='under');
      td.classList.toggle('over',st==='over');
    }
  }
  paintTsTotals();
  tsCommit();
}

function bindTsGrid(){
  const wrap=$('#p-sheet .tsgrid-wrap');
  if(!wrap)return;
  const days=tsDays(TS.month),last=days.length?days[days.length-1].d:31;
  wrap.querySelectorAll('.tsg input[data-r]').forEach(inp=>{
    inp.oninput=()=>tsStamp(+inp.dataset.r,+inp.dataset.d,inp.value);
    /* the grid is filled by hand, so it navigates like a spreadsheet */
    inp.onkeydown=e=>{
      const r=+inp.dataset.r,d=+inp.dataset.d;
      const rows=TS.rows.length;
      if(e.key==='ArrowDown'||e.key==='Enter'){e.preventDefault();tsFocus(Math.min(rows-1,r+1),d);}
      else if(e.key==='ArrowUp'){e.preventDefault();tsFocus(Math.max(0,r-1),d);}
      else if(e.key==='ArrowRight'&&inp.selectionStart>=inp.value.length){e.preventDefault();
        if(d<last)tsFocus(r,d+1);else if(r<rows-1)tsFocus(r+1,days[0].d);}
      else if(e.key==='ArrowLeft'&&inp.selectionStart===0){e.preventDefault();
        if(d>days[0].d)tsFocus(r,d-1);else if(r>0)tsFocus(r-1,last);}
      /* the two that save the most typing: copy the day above, and stamp the
         standard shift on an empty day */
      else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='d'){
        e.preventDefault();
        if(r>0)tsStamp(r,d,(TS.rows[r-1].days||{})[d]||'');
      }
      else if(e.key===' '&&!inp.value){
        e.preventDefault();
        const day=days[d-1],h=num(TS.rows[r].hours)||num(S.settings.tsHours)||8;
        tsStamp(r,d,tsBrush!==null?tsBrushFor(r,d):tsH(h-(day&&day.short?1:0)));
      }
    };
    inp.onfocus=()=>inp.select();
  });

     elementFromPoint rather than pointerover, because a captured pointer

  const cellAt=e=>{
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const td=el&&el.closest?el.closest('td.d'):null;
    return td?td.querySelector('input[data-r]'):null;
  };
  const paint=inp=>{if(inp){const r=+inp.dataset.r,d=+inp.dataset.d;tsStamp(r,d,tsBrushFor(r,d));}};
  wrap.onpointerdown=e=>{
    if(tsBrush===null||e.button)return;
    const inp=cellAt(e);
    if(!inp)return;
    e.preventDefault();          /* painting should not put a caret in the cell */

           <div class="ks">${rt.days} ${esc(t('tsCodeDays').toLowerCase())}</div></div>
